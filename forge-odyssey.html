<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Per-page SEO (title, description, canonical, Open Graph, JSON-LD) is
     injected here by build.cjs, because it differs per game: this shell is
     shared by CLAWBYTE, NOSTOS and the two Forge editors. -->
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE FORGE</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  html,body{margin:0;padding:0;background:#04060a;height:100%;overflow:hidden;overscroll-behavior:none}
  body{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas#cv{max-width:100vw;max-height:100vh;max-height:100dvh;aspect-ratio:16/9;outline:none;touch-action:none;
    box-shadow:0 0 80px rgba(60,220,255,.12);border-radius:6px}
</style>
</head>
<body>
<canvas id="cv" width="960" height="540"></canvas>
<canvas id="tc" style="position:fixed;inset:0;z-index:5;display:none;pointer-events:none"></canvas>
<script>window.GAME_LOCK="hero"</script>
<div id="cbload" role="status" aria-live="polite">
  <div id="cbloadt">CLAWBYTE</div>
  <div id="cbloadn">Preparing your journey</div>
  <div id="cbloadb"><i id="cbloadbar"></i></div>
  <button id="cbloadretry" type="button" hidden>Retry loading</button>
  <small>VibeSolutions</small>
</div>
<style>
#cbload{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 46%,#112732,#05080d 65%);z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .35s;color:#accbd5}
#cbloadt{font:700 clamp(26px,5vw,42px) system-ui,sans-serif;letter-spacing:.22em;color:#afffe9;text-shadow:0 0 26px #37ffd044}
#cbloadn{font:500 13px system-ui,sans-serif;min-height:18px;text-align:center;max-width:90vw}
#cbloadb{width:min(280px,70vw);height:4px;background:#1d3543;border-radius:3px;overflow:hidden}
#cbloadbar{display:block;height:100%;width:0;background:#72e9c5;transition:width .2s ease}
#cbloadretry{border:1px solid #65cdb2;border-radius:7px;background:#112b34;color:#d4fff4;padding:12px 22px;font:600 14px system-ui;cursor:pointer}
#cbload small{font:500 11px system-ui,sans-serif;letter-spacing:.15em;opacity:.55}
</style>
<script>
(() => {
  const title=document.getElementById('cbloadt');
  if (window.GAME_LOCK === 'hero') title.textContent='NOSTOS';
  document.getElementById('cbloadretry').addEventListener('click',()=>{
    if (typeof requestHeroArt==='function') requestHeroArt();
  });
})();
</script>

// THE FIRST BOSS â€” virus-infected robot beast.
//
// Assembled from the authored parts sheet exactly as designed: every part
// (head, neck, body, two-segment legs, chained tail) is its own sprite
// mounted on a skeleton of nested pivots. Walking is legs actually swinging
// from shoulder and hip with knee counter-flex; roaring is the neck and head
// really rotating back; death is the machine folding onto the ground and its
// virus-light going out. Nothing here is a whole picture sliding around.
//
// Parts atlas layout (built from the uploaded sheet, white keyed out):
const BEAST_P = {
  head: [6, 6, 154, 158], neck: [166, 6, 69, 88], body: [241, 6, 204, 144],
  fleg0: [451, 6, 68, 82], fleg1: [525, 6, 70, 109],
  bleg0: [601, 6, 70, 79], bleg1: [677, 6, 72, 114],
  tail0: [755, 6, 54, 45], tail1: [815, 6, 43, 39], tail2: [864, 6, 50, 32], tail3: [920, 6, 45, 28],
  full: [971, 6, 517, 270],
  // the authored animation poses: complete connected figures, extracted by
  // component mask (never rectangle cuts), baked shadows removed
  aIdle: [6, 282, 197, 149], aWalk: [209, 282, 207, 139],
  aRoar: [422, 282, 237, 159], aAtk: [665, 282, 207, 106],
};
const BEAST_H = 270;              // the full figure's standing height in atlas px
const BEAST_F = 270 / 149;        // example-pose panel scale -> rig scale
const BEAST_CACHE = { dark: null, glow: {} };
// assembly anchors, exposed so the auditor can calibrate them against the art
const BEAST_TUNE = { headX: -82, headY: -188, bodyX: 118, bodyY: 229, shX: -100, hpX: 62 };
// live-render state the glow overlays read: set per-draw, never persisted
const BEAST_LIVE = { t: 0, glow: 1, charge: 0 };

// ---------------------------------------------------------------------------
// THE VIRUS VEINS. The artist already painted every emissive mark â€” eye,
// core discs, joint lights, the tail spade. Scan each sprite ONCE for its
// purple pixels, cluster them, and breathe additive pulses at exactly those
// authored positions. Nothing is repainted; the light just lives.
// ---------------------------------------------------------------------------
function beastGlowSpots(key) {
  const cache = BEAST_CACHE.glow;
  if (cache[key] !== undefined) return cache[key];
  const im = beastImg(); if (!im || !im.naturalWidth) return null;
  const s = BEAST_P[key];
  const cv = document.createElement('canvas'); cv.width = s[2]; cv.height = s[3];
  const q = cv.getContext('2d', { willReadFrequently: true });
  q.drawImage(im, s[0], s[1], s[2], s[3], 0, 0, s[2], s[3]);
  let d;
  try { d = q.getImageData(0, 0, s[2], s[3]).data; } catch (e) { return (cache[key] = null); }
  const cl = [];
  for (let y = 0; y < s[3]; y += 2) for (let x = 0; x < s[2]; x += 2) {
    const i = (y * s[2] + x) * 4;
    const r = d[i], g = d[i + 1], b = d[i + 2];
    // the authored virus purple: blue-heavy, red-warm, green-starved
    if (d[i + 3] > 120 && b > 140 && r > 70 && b - g > 60 && r - g > 8) {
      let hit = null;
      for (const c2 of cl)
        if (Math.abs(x - c2.sx / c2.n) < 13 && Math.abs(y - c2.sy / c2.n) < 13) { hit = c2; break; }
      if (hit) { hit.sx += x; hit.sy += y; hit.n++; }
      else cl.push({ sx: x, sy: y, n: 1 });
    }
  }
  const out = cl.filter(c2 => c2.n >= 2)
    .sort((a2, b2) => b2.n - a2.n).slice(0, 14)
    .map(c2 => ({
      x: c2.sx / c2.n, y: c2.sy / c2.n,
      r: 4.5 + Math.min(15, Math.sqrt(c2.n) * 2.4),
    }));
  cache[key] = out;
  return out;
}

// breathe the pulses over a just-drawn sprite. (px,py) is the same pivot
// offset the sprite was drawn with; dim knocks far-side veins back.
function bGlowOver(c, key, px, py, dim, sc) {
  const k = BEAST_LIVE.glow * (dim || 1);
  if (k <= 0.05) return;
  const spots = beastGlowSpots(key);
  if (!spots || !spots.length) return;
  const F = sc || 1;
  c.save(); c.globalCompositeOperation = 'lighter';
  for (const sp of spots) {
    // the wave travels ALONG the body: phase keyed to the vein's x position
    const ph = BEAST_LIVE.t * 2.7 + sp.x * 0.05 + sp.y * 0.02;
    const a = Math.max(0, k * (0.16 + 0.15 * Math.sin(ph)));
    if (a <= 0.02) continue;
    const gx = (sp.x - px) * F, gy = (sp.y - py) * F;
    const gr = sp.r * F * (1.15 + 0.3 * Math.sin(ph * 0.5 + 1));
    const gg = c.createRadialGradient(gx, gy, 0.5, gx, gy, gr);
    if (BEAST_LIVE.pure) {
      // the virus is gone: the same authored vein positions breathe CLEAN
      gg.addColorStop(0, 'rgba(190,255,240,' + Math.min(0.8, a * 1.6) + ')');
      gg.addColorStop(0.5, 'rgba(90,235,205,' + a + ')');
      gg.addColorStop(1, 'rgba(20,140,120,0)');
    } else if (BEAST_LIVE.charge > 0.02) {
      // WINDING UP: every authored vein runs from virus purple to the game's
      // one warning colour. The Hue Law already says amber means "this is
      // coming" and nothing else in the game is allowed to use it, so the
      // charge does not need explaining â€” a player who has met one telegraph
      // has met this one. It is the whole animal that changes, not a badge.
      const q = BEAST_LIVE.charge;
      const mix = (c0, c1) => Math.round(c0 + (c1 - c0) * q);
      const r0 = mix(226, 255), g0 = mix(168, 246), b0 = mix(255, 205);
      const r1 = mix(176, 255), g1 = mix(106, 194), b1 = mix(255, 74);
      gg.addColorStop(0, 'rgba(' + r0 + ',' + g0 + ',' + b0 + ',' + Math.min(0.9, a * (1.6 + q)) + ')');
      gg.addColorStop(0.5, 'rgba(' + r1 + ',' + g1 + ',' + b1 + ',' + (a * (1 + q * 0.6)) + ')');
      gg.addColorStop(1, 'rgba(' + mix(120, 180) + ',' + mix(50, 90) + ',' + mix(210, 20) + ',0)');
    } else {
      gg.addColorStop(0, 'rgba(226,168,255,' + Math.min(0.8, a * 1.6) + ')');
      gg.addColorStop(0.5, 'rgba(176,106,255,' + a + ')');
      gg.addColorStop(1, 'rgba(120,50,210,0)');
    }
    c.fillStyle = gg;
    c.beginPath(); c.arc(gx, gy, gr, 0, 7); c.fill();
  }
  c.restore();
}

function beastImg() {
  if (typeof MEDIA_IMG === 'undefined') return null;
  return (typeof softArt === 'function' && softArt('beastParts')) || MEDIA_IMG.beastParts;
}

// ---------------------------------------------------------------------------
// THE FRONT VIEW, built from the authored art itself. The sheet has no
// straight-on figure, but the 3/4 head mirrored about its face axis gives a
// true two-eyed front face (every pixel is the artist's), the body sprite's
// chest disc is the torso seen end-on, and the leg sprites stand under it.
// The turn passes THROUGH this â€” side, front, side â€” never a flat sliver.
// ---------------------------------------------------------------------------
function beastFront() {
  if (BEAST_CACHE.front) return BEAST_CACHE.front;

  part('fleg1', CXc + 34, GY - 58, 1, true);

// THE PURIFIED ATLAS: the virus is destroyed, so its purple must leave the
// body too. Every blue-heavy virus pixel in the authored sheet is remapped
// to a clean teal â€” same art, same positions, the infection gone.
function beastPure() {
  if (BEAST_CACHE.pureAtlas !== undefined) return BEAST_CACHE.pureAtlas;
  const im = beastImg(); if (!im || !im.naturalWidth) return null;
  const cv = document.createElement('canvas');
  cv.width = im.naturalWidth; cv.height = im.naturalHeight;
  const x = cv.getContext('2d', { willReadFrequently: true });
  x.drawImage(im, 0, 0);
  let d;
  try { d = x.getImageData(0, 0, cv.width, cv.height); }
  catch (e) { return (BEAST_CACHE.pureAtlas = null); }
  const p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    const r = p[i], g = p[i + 1], b2 = p[i + 2];
    // the same virus-purple test the vein scanner uses, softened to catch
    // the dimmer edges of each glow disc
    if (p[i + 3] > 60 && b2 > 110 && b2 - g > 35 && r - g > 0) {
      p[i] = Math.round(r * 0.3);
      p[i + 1] = Math.min(255, Math.round(b2 * 0.95));
      p[i + 2] = Math.round(b2 * 0.8);

}
// far-side limbs use a darkened copy of the atlas so depth reads
function beastDark() {

// smear copies use a violet-flooded atlas â€” the virus afterimage, not a xerox
function beastViolet() {

// draw one AUTHORED whole-figure pose, bottom-aligned on the ground line.
// These are the sheet's own key poses â€” the open-jaw roar and the crouched
// attack exist only as whole figures, so the rig hands over to them.
function bFig(c, key, rot, shake, sqx, sqy) {
  const s = BEAST_P[key];
  const w = s[2] * BEAST_F, h = s[3] * BEAST_F;
  c.save();
  if (shake) c.translate((bossPoseNoise(BEAST_LIVE.t,41)-.5)*shake, (bossPoseNoise(BEAST_LIVE.t,43)-.5)*shake*.5);
  // squash & stretch about the ground contact â€” anticipation compresses,
  // launch stretches past 1.0, the art itself is never resampled oddly
  if (sqx || sqy) c.scale(sqx || 1, sqy || 1);
  if (rot) { c.translate(0, -h * 0.4); c.rotate(rot); c.translate(0, h * 0.4); }
  c.drawImage(beastImg(), s[0], s[1], s[2], s[3], -w / 2, -h, w, h);
  // the figure's own authored veins breathe too
  c.translate(-w / 2, -h);
  bGlowOver(c, key, 0, 0, 1, BEAST_F);
  c.restore();
}

// THE SLEEPING LION â€” composed flat from his own parts, the way lions
// actually sleep: belly on the ground, forelegs stretched flat in front,
// the head resting down ON them inside the mane, tail lying still along
// the ground. lift 0..1 is the stir: the head rises first, then the chest.
// Local space: authored (faces LEFT), ground y=0, caller scaled/mirrored.
function bSleep(c, t, lift) {
  const br = Math.sin(t * 0.75);
  BEAST_LIVE.t = t; BEAST_LIVE.glow = 0.08 + Math.max(0, br) * 0.06 + lift * 0.8;
  c.save();
  c.translate(0, br * 1.6 * (1 - lift) - lift * 26);
  // the body, belly on the ground (bottom of the torso at the floor line)
  c.save(); c.translate(0, 85 - lift * 30); c.rotate(-0.02 + lift * 0.05);
  bPart(c, 'body', BEAST_TUNE.bodyX, BEAST_TUNE.bodyY); c.restore();
  // the haunch: ONE round hip mass settled against the rump â€” a sleeping
  // lion's hind legs disappear under the body, so no shank ever shows
  c.save(); c.translate(58, -42 + lift * 8); c.rotate(-0.35);
  bPart(c, 'bleg0', BEAST_P.bleg0[2] / 2, BEAST_P.bleg0[3] / 2); c.restore();
  // the tail: one CONNECTED curve hugging the near flank, the spade tip
  // resting by the forepaws â€” segments overlapped along the arc so it
  // reads as a single limb, never scattered pieces
  {
    const PTS = [[86, -30], [52, -14], [12, -9], [-30, -9], [-68, -12]];
    for (let i = 0; i < 4; i++) {
      const key = 'tail' + i;
      const mx = (PTS[i][0] + PTS[i + 1][0]) / 2, my = (PTS[i][1] + PTS[i + 1][1]) / 2;
      const a = Math.atan2(PTS[i + 1][1] - PTS[i][1], PTS[i + 1][0] - PTS[i][0]);
      c.save();
      c.translate(mx, my - (i === 3 ? Math.max(0, br) * 2 : 0));
      c.rotate(a + Math.PI);                     // pieces are authored tip-back
      bPart(c, key, BEAST_P[key][2] / 2, BEAST_P[key][3] / 2);
      c.restore();
    }
  }
  // forelegs stretched FLAT in front â€” far one first, darkened
  c.save(); c.translate(-136, -15 - lift * 8); c.rotate(1.42); bPart(c, 'fleg1', 35, 54, true); c.restore();
  c.save(); c.translate(-152, -13 - lift * 10); c.rotate(1.5); bPart(c, 'fleg1', 35, 54); c.restore();
  // the head, resting on the stretched paws â€” the stir raises it first
  c.save();
  c.translate(-128 + lift * 20, -58 - lift * 96);
  c.rotate(0.42 - lift * 0.55);
  bPart(c, 'head', 118, 92);
  c.restore();
  c.restore();
}

// draw one part with its pivot at the current origin
function bPart(c, key, px, py, dark) {
  const s = BEAST_P[key];

// THE LEAP. A cat jumping is a MOTION, not a picture.

// side view â€” squashed a little on the coil and stretched a little in the air.
// Laid out frame by frame (tools/leapshot.cjs) it is unmistakable: a rigid lion

// nothing lands. That is what "it does not show a full motion of a lion

// thing is the frames BETWEEN the poses.

//

//           level and locked on. The spring is visibly wound.
//   DRIVE   hind legs snap straight back off the ground, forelegs fold up under

//           missing entirely and it is the one that sells the power.

    // THE WHOLE LEAP USED TO BE INTERCEPTED HERE and handed to `aAtk` â€” the
    // authored standing side view â€” squashed on the coil, stretched in the air.
    // Six different beats, one drawing. It is the rig's job now (beastLeap /
    // beastCoil): the same restyled 3D parts the stalk and the landing already
    // use, posed through a motion instead of scaled through one. The body
    // stretch stays, applied to the rig, because a leap wants the smear.
    } else if ((b.st === 'crouch' || b.st === 'springwarn' || b.st === 'nullhop') && !b.dead) {
      // the wind-up, drawn as a machine loading â€” see beastCoilFx
      const dur = b.phase === 2 ? 0.9 : 1.0;
      const k = b.st === 'nullhop' ? 1
        : 1 - Math.max(0, Math.min(1, (b.t || 0) / (b.st === 'springwarn' ? 0.42 : dur)));
      // the veins go amber IMMEDIATELY and then deepen â€” the recolour is the
      // cheapest, largest-area part of the surge, so holding it back until the
      // wind-up is half over throws away the half that matters most
      BEAST_LIVE.charge = 0.32 + 0.68 * k;
      if (!beastStrip(c, b)) beastDraw(c, b, beastPose(b));
      if (!G.artProbe) beastCoilFx(c, b, k);   // see G.artProbe in entities.js
      // THE FLASH. The last beat before it goes: one white pop over the whole
      // animal, so the cue to move is a single unmissable event rather than a
      // ramp the eye can sit through. It fires with just over a fifth of a
      // second left â€” enough to act on, not enough to ignore.
      // A FLAT fill is what this was, and a flat additive ellipse over a grey
      // room is fog: it has no centre, no edge, and no direction. It is a
      // gradient bloom now â€” a hot core that falls off, which is what light
      // does and what makes the eye call this an event instead of weather.
      if (k > 0.80) {
        const f = Math.min(1, (k - 0.80) / 0.14);
        const pulse = Math.sin(Math.PI * Math.min(1, (k - .8) / .2));
        c.save();
        c.globalCompositeOperation = 'lighter';
        const R = 150 + f * 105;
        const gg = c.createRadialGradient(0, -140, 8, 0, -140, R);
        gg.addColorStop(0, 'rgba(255,250,232,' + (0.60 * f * pulse) + ')');
        gg.addColorStop(0.34, 'rgba(255,206,116,' + (0.30 * f * pulse) + ')');
        gg.addColorStop(1, 'rgba(255,150,40,0)');
        c.fillStyle = gg;
        c.beginPath(); c.ellipse(0, -140, R, R * 0.82, 0, 0, 7); c.fill();
        c.restore(); c.globalAlpha = 1;
      }
      BEAST_LIVE.charge = 0;
    } else if ((b.st === 'pounce' || b.st === 'spring' || b.st === 'dive') && !b.dead) {
      const up = Math.max(0, Math.min(0.55, -(b.vy || 0) / 1000));
      const dn = Math.max(0, Math.min(0.5, (b.vy || 0) / 1000));
      // THE BODY FOLLOWS THE ARC. Nose up off the launch, level at the apex,
      // nose down into the landing â€” the one thing that makes a leap read as
      // a heavy animal going over the top rather than a picture sliding on a
      // curve. Pivot at the body's middle. The rig faces LEFT, so a positive
      // rotation lifts the nose.
      // ...which the FILMED leap already does, in its own frames: nose up off
      // the launch, extended over the top, forepaws reaching for the ground.
      // Pitching and stretching those frames again bent a filmed body by a
      // second, invented arc. The rig still needs both; the take needs neither.
      if (!beastStrip(c, b)) {
        if (b.st === 'pounce') {
          const pitch = Math.max(-0.3, Math.min(0.26, -(b.vy || 0) / 2600));
          c.translate(0, -135); c.rotate(pitch); c.translate(0, 135);
        }
        c.scale(1 - up * 0.10 + dn * 0.05, 1 + up * 0.16 - dn * 0.04);
        beastDraw(c, b, beastPose(b));
      }
    } else if ((b.st === 'swipe' || b.st === 'swipewarn') && !b.dead) {
      // THE CLAW, which is the whole point of a lion's swipe and which this
      // fight did not previously show. The pose rotated a foreleg and the game
      // spawned a hitbox; what the player SAW was the animal leaning. So the
      // paw is now the loudest thing on screen for a quarter of a second â€”
      // claws unsheathed on the wind-up, an arc that follows where they have
      // actually been, and four separate trails, because one wide swoosh is a
      // sword and four is a hand.
      // ...unless the filmed swipe is here, which carries its own claws: the
      // trails are fitted to the rig's paw and would hang off the take's
      if (!beastStrip(c, b)) {
        const P = beastPose(b);
        beastDraw(c, b, P);
        beastClawFx(c, b, P);
      }
    } else if (b.st === 'daze' && !b.dead) {
      // broken open: the head shakes itself, the veins gutter, and it does not
      // defend. See the entities-side state â€” this branch only draws it.
      if (!beastStrip(c, b)) beastDraw(c, b, beastPose(b));
      if (!G.artProbe) beastDazeFx(c, b);      // see G.artProbe in entities.js
    } else if (b.st === 'nullend' && !b.dead) {
      // the field's collapse dropped it flat â€” sprawled and spent
      BEAST_LIVE.glow = 0.5;
      if (!beastStrip(c, b)) bFig(c, 'aAtk', 0.12, 0.6, 1.06, 0.96);
    } else if (b.st === 'nullcharge' && !b.dead) {
      // stands dead still while gravity is unplugged; virus light climbs the coat
      if (!beastStrip(c, b)) beastDraw(c, b, beastPose(b));
      c.save(); c.globalCompositeOperation = 'lighter';
      const ng = c.createRadialGradient(0, -120, 10, 0, -120, 190);
      ng.addColorStop(0, 'rgba(176,106,255,' + (0.24 + Math.sin(b.anim * 9) * 0.12) + ')');
      ng.addColorStop(1, 'rgba(176,106,255,0)');
      c.fillStyle = ng; c.beginPath(); c.arc(0, -120, 190, 0, 7); c.fill();
      c.restore();
    } else if (b.st === 'dorm' && !b.dead) {
      // asleep, composed flat from his own parts â€” only the breath moves
      bSleep(c, b.anim, 0);
    } else if (b.st === 'intro' && (b.t || 0) > 1.0 && !b.dead) {
      // the stir: head off the paws first, chest following â€” still down
      const k = clamp(1 - (b.t || 0) / 2, 0, 1);
      c.save();
      if (k > 0.2) c.translate((bossPoseNoise(b.anim,47)*2-1)*k*3, (bossPoseNoise(b.anim,49)*2-1)*k);
      bSleep(c, b.anim, clamp(k / 0.5, 0, 1));
      c.restore();
    } else if (b.st === 'intro' && !b.dead) {
      // the wake's climax: up onto his feet and straight into the authored
      // open-jaw howl, holding it while the roar plays out
      BEAST_LIVE.glow = 1.4;
      if (!beastStrip(c, b)) bFig(c, 'aRoar', 0, 2 + Math.max(0, (b.t || 0) - 0.35) * 5);
    } else if (b.st === 'roar' && (b.t || 0) > 0.25 && (b.t || 0) <= 1.07 && !b.dead) {
      // THE ROAR â€” the sheet's own open-jaw howl, shaking harder as it
      // peaks. (The first ~0.18s stays on the rig: the chest swells up into
      // this figure instead of snapping to it.)
      BEAST_LIVE.glow = 1.5;
      if (!beastStrip(c, b)) bFig(c, 'aRoar', 0, 1 + Math.max(0, 1.25 - (b.t || 0)) * 6);
      // the virus orb GATHERS in the throat through the inhale (the tell),
      // pulsing brighter each beat, then floods out as the roar breaks
      const inh = Math.max(0, Math.min(1, (1.25 - (b.t || 0)) / 0.5));
      const orbR = 22 + inh * 44;
      const pulse = 0.5 + Math.sin(b.anim * 13) * 0.22 * (0.4 + inh);
      c.save(); c.globalCompositeOperation = 'lighter';
      const mg = c.createRadialGradient(-150, -215, 2, -150, -215, orbR);
      mg.addColorStop(0, 'rgba(240,200,255,' + Math.min(0.95, 0.45 + pulse * 0.5) + ')');
      mg.addColorStop(0.4, 'rgba(220,150,255,' + (0.35 + inh * 0.3) + ')');
      mg.addColorStop(1, 'rgba(140,60,220,0)');
      c.fillStyle = mg; c.beginPath(); c.arc(-150, -215, orbR, 0, 7); c.fill();
      c.restore();
    } else {
      // WEIGHT ON THE GROUND. A touchdown squashes the body into its legs and
      // lets it back up over a fifth of a second; standing, it breathes. Both
      // anchored at the feet (the origin), so the paws never leave the floor.
      // (The rig's, that is. The filmed landing compresses into its own legs
      // and the filmed idle breathes; scaling either a second time is the
      // double bob the boss-motion pass removed everywhere but here.)
      if (!beastStrip(c, b)) {
        const since = (b.anim || 0) - (b.landAt == null ? -9 : b.landAt);
        if (b.st === 'recover' && since < 0.22) {
          const k = 1 - since / 0.22;
          c.scale(1 + 0.08 * k, 1 - 0.12 * k);
        } else if (b.st === 'idle') {
          const br = Math.sin((b.anim || 0) * 2.4);
          c.scale(1 - 0.006 * br, 1 + 0.016 * br);
        }
        beastDraw(c, b, beastPose(b));
      }
    }
    c.restore();
    return true;
  } catch (e) { return false; }
}


// BOSS 01 â€” TALONHOST, the virus-infected robot eagle. And its flock.
//
// Every rendered state IS an authored figure from the sheet â€” the hanging
// idle on its mount, the WINGS DOWN / WINGS UP flip-book frames for flight,
// the CHARGE / FIRE / RECOVER attack sequence, the metallic feather art as
// projectiles. This code never invents anatomy: it only picks the authored
// frame, aligns frames on the glowing chest core so nothing jumps, and adds
// rigid motion (cable pendulum, wing-beat timing, dive banking) plus glow
// and wind.
const EAGLE_P = {
  eHead: [6, 6, 85, 107], eBody: [97, 6, 105, 134],
  eWingU: [208, 6, 181, 107], eWingL: [395, 6, 147, 90], eWingT: [548, 6, 73, 70],
  eTail: [627, 6, 98, 129], eMount: [731, 6, 109, 98], eTalon: [846, 6, 97, 90],
  eFull: [949, 6, 532, 313],
  pIdle: [6, 325, 173, 155], pDown: [185, 325, 188, 204],
  pUp: [379, 325, 182, 195], pShoot: [567, 325, 252, 157],
  kCharge: [825, 325, 228, 128], kFire: [1059, 325, 210, 116], kRecover: [1275, 325, 204, 119],
  fea0: [6, 535, 62, 30], fea1: [74, 535, 125, 34], fea2: [205, 535, 136, 33],
  // the bird alone, without its ceiling mount: pIdle minus the mount rows â€”
  // used when it perches low to rest and when it lies dead
  pRest: [6, 371, 173, 109],
};
const EAGLE_F = 2.11;             // panel figure scale -> in-world master scale
const EAGLE_CACHE = { anchors: null };

let EG_PURE = false;              // drawEagle sets this from b.purified
let EG_PURE_CV = undefined;
// the purified sheet: every hot virus-red pixel remapped to clean teal
function egPureAtlas(im) {
  if (EG_PURE_CV !== undefined) return EG_PURE_CV;
  // never cache before the sheet has decoded â€” a 0-size canvas is forever
  if (!im || !im.naturalWidth) return null;
  const cv = document.createElement('canvas');
  cv.width = im.naturalWidth; cv.height = im.naturalHeight;
  const x = cv.getContext('2d', { willReadFrequently: true });
  x.drawImage(im, 0, 0);
  let d;
  try { d = x.getImageData(0, 0, cv.width, cv.height); }
  catch (e) { return (EG_PURE_CV = null); }
  const p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    const r = p[i], g = p[i + 1], b2 = p[i + 2];
    if (p[i + 3] > 60 && r > 130 && r - g > 55 && r - b2 > 45) {
      p[i] = Math.round(r * 0.25);
      p[i + 1] = Math.min(255, Math.round(r * 0.9 + 40));
      p[i + 2] = Math.round(r * 0.72);
    }
  }
  x.putImageData(d, 0, 0);
  return (EG_PURE_CV = cv);
}
function eagleImg() {
  const im = typeof MEDIA_IMG !== 'undefined' && ((typeof softArt === 'function' && softArt('eagleParts')) || MEDIA_IMG.eagleParts);
  if (im && EG_PURE) { const pv = egPureAtlas(im); if (pv) return pv; }
  return im;
}

// each figure is registered on its glowing chest core, found by scanning the
// art itself â€” so alternating frames stay locked to one another
function eagleAnchors() {
  if (EAGLE_CACHE.anchors) return EAGLE_CACHE.anchors;
  // always scan the RAW sheet: the purified remap moves the red the scan needs
  const im = typeof MEDIA_IMG !== 'undefined' && ((typeof softArt === 'function' && softArt('eagleParts')) || MEDIA_IMG.eagleParts);
  if (!im || !im.naturalWidth) return null;
  const cv = document.createElement('canvas');
  cv.width = im.naturalWidth; cv.height = im.naturalHeight;
  const x = cv.getContext('2d'); x.drawImage(im, 0, 0);
  const out = {};
  for (const key of ['pIdle', 'pDown', 'pUp', 'pShoot', 'kCharge', 'kFire', 'kRecover', 'pRest']) {
    const s = EAGLE_P[key];
    const d = x.getImageData(s[0], s[1], s[2], s[3]).data;
    let mx = 0, my = 0, n = 0;
    for (let i = 0; i < s[2] * s[3]; i++) {
      const r = d[i * 4], g = d[i * 4 + 1], b = d[i * 4 + 2], a = d[i * 4 + 3];
      if (a > 120 && r > 185 && r - g > 85 && r - b > 70) { mx += i % s[2]; my += (i / s[2]) | 0; n++; }
    }
    out[key] = n ? [mx / n, my / n] : [s[2] / 2, s[3] / 2];
  }
  EAGLE_CACHE.anchors = out;
  return out;
}

// draw one authored figure with its chest core at the origin
function egFigA(c, key, alpha, rot) {
  const A = eagleAnchors(); if (!A) return;
  const s = EAGLE_P[key], an = A[key];
  c.save();
  if (rot) c.rotate(rot);
  if (alpha != null) c.globalAlpha *= alpha;
  c.scale(EAGLE_F, EAGLE_F);
  c.drawImage(eagleImg(), s[0], s[1], s[2], s[3], -an[0], -an[1], s[2], s[3]);
  // a cross-faded figure lends its eyes only while it is the one on top
  if (alpha == null || alpha >= 0.5) infEyeArt(c, 'eagleParts:' + key, 0, -an[0], -an[1], s[2], s[3]);
  c.restore();
}

// ---- wing-beat timing ----
// A real wing-beat is asymmetric: the power stroke SNAPS down fast, the
// recovery sweeps back up slow. egBeat warps a 0..1 cycle phase into the
// wings-up weight (1 = pUp figure, 0 = pDown figure) with that asymmetry â€”
// a third of the cycle for the strike, a beat of glide on the downstroke,
// the rest for the slow recovery.
function egBeat(p) {
  p = p - Math.floor(p);
  if (p < 0.32) { const u = p / 0.32; return 1 - u * u * (3 - 2 * u); }   // power stroke
  if (p < 0.46) return 0;                                                 // glide on it
  const u = (p - 0.46) / 0.54; return u * u * (3 - 2 * u);                // slow recovery
}

// flight: the sheet's own wings-down / wings-up frames alternating, blended
// through egBeat's cadence. The body bob is derived from the same warp, so
// she lifts on the strike and settles through the recovery. `heavy` is the
// laboured version â€” bigger travel, the nose dipping into each stroke.
function egFlap(c, t, spd, rot, heavy) {
  const k = egBeat((t * spd) / (Math.PI * 2));
  const amp = heavy ? 13 : 7;
  c.save(); c.translate(0, (k * 2 - 1) * amp);
  const pitch = (rot || 0) + (heavy ? (0.5 - k) * 0.09 : 0);
  if (k < 0.22) egFigA(c, 'pDown', 1, pitch);
  else if (k > 0.78) egFigA(c, 'pUp', 1, pitch);
  else {
    const m = (k - 0.22) / 0.56;
    egFigA(c, 'pDown', 1 - m, pitch);
    egFigA(c, 'pUp', m, pitch);
  }
  c.restore();
}

function egChestGlow(c, k) {
  if (k <= 0.05) return;
  c.save(); c.globalCompositeOperation = 'lighter';
  const gg = c.createRadialGradient(0, 0, 2, 0, 0, 34 * k);
  gg.addColorStop(0, 'rgba(255,120,130,' + Math.min(0.8, 0.45 * k).toFixed(2) + ')');
  gg.addColorStop(1, 'rgba(200,30,50,0)');
  c.fillStyle = gg; c.beginPath(); c.arc(0, 0, 34 * k, 0, 7); c.fill();
  c.restore();
}

// ---- the cable rig (visual only) ----
// One damped pendulum shared by every state: loaded and stiff while she
// hangs, loose while the empty cable dangles over the perch. The AI injects
// impulses into cabV (volley recoil, swoop departure, the catch on return);
// integration lives here so the swing keeps settling even through hit-stagger.
function egCableTick(b, dt) {
  const dtv = Math.max(0, Math.min(.05, dt));
  if (b.cabA == null) { b.cabA = 0; b.cabV = 0; }
  const hang = !b.dead && (b.st === 'idle' || b.st === 'dorm' || b.st === 'intro' ||
    b.st === 'volley' || b.st === 'broodcall');
  const k = hang ? 24 : 6.5, dmp = hang ? 2.4 : 0.8;
  b.cabV += (-k * b.cabA - dmp * b.cabV) * dtv;
  b.cabA += b.cabV * dtv;
  if (hang) {
    // her own drift under the anchor rocks the hang â€” gently; the spring
    // does the storytelling, not the raw travel
    const hx = b.x + b.w / 2;
    if (b._phx != null) b.cabV -= (hx - b._phx) * 0.012;
    b._phx = hx;
  } else b._phx = null;
  b.cabV = Math.max(-2.6, Math.min(2.6, b.cabV));
  b.cabA = Math.max(-0.42, Math.min(0.42, b.cabA));
  b.fireKick = Math.max(0, (b.fireKick || 0) - dtv * 5);
  // per-state visual clock, for tells that BUILD (charge shudder, rise beats)
  if (b.st !== b._stPrev) { b._stPrev = b.st; b._stT = 0; } else b._stT = (b._stT || 0) + dtv;
  return hang;
}

// a hung cable is never a ruler line: slight catenary sag when slack, bowing
// against the swing when it whips
function egCableStroke(c, x0, y0, x1, y1, bow) {
  const mx = (x0 + x1) / 2 + bow, my = (y0 + y1) / 2 + Math.abs(bow) * 0.3 + 7;
  c.save(); c.lineCap = 'round';
  c.strokeStyle = '#2c3138'; c.lineWidth = 4.5;
  c.beginPath(); c.moveTo(x0, y0); c.quadraticCurveTo(mx, my, x1, y1); c.stroke();
  c.strokeStyle = '#4a525c'; c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(x0 - 1.2, y0); c.quadraticCurveTo(mx - 1.2, my, x1 - 1.2, y1); c.stroke();
  // ceiling grommet
  c.fillStyle = '#3a4048'; c.fillRect(x0 - 6, y0 - 3, 12, 6);
  c.fillStyle = '#20242a'; c.fillRect(x0 - 3, y0 + 1, 6, 3);
  c.restore();
}

function drawEagle(c, b) {
  EG_PURE = !!b.purified;
  const im = eagleImg(); if (!im || (!im.naturalWidth && !im.getContext)) return false;
  c.save();
  try {
    const S = (b.w * 3.0) / 532;
    const cx = b.x + b.w / 2;
    let cy = b.y + b.h / 2;
    const hang = !b.dead && ['idle','dorm','intro','volley','broodcall'].includes(b.st);
    // the ceiling anchor is FIXED where she first roosted; everything the
    // cable does happens between that point and the mount on her back
    const hangX = b.hangX != null ? b.hangX : (b.spawnX != null ? b.spawnX : b.x) + b.w / 2;
    const ancY = (b.homeY != null ? b.homeY : 60) + b.h / 2 - 300 * S;
    if (b.dead) {
      // drops out of the air onto the floor
      const k = 1 - Math.max(0, Math.min(1, (b.deathAnimT || 0) / 1.6));
      const floor = 15 * TILE - b.h / 2 - 10;
      cy = cy + (floor - cy) * k * k;
    }
    if (!hang) {
      // she has left the cable: it dangles empty over the perch, still
      // carrying whatever swing her departure put into it
      c.save(); c.translate(hangX, ancY); c.scale(S, S);
      const a = (b.cabA || 0) * 1.7;
      const tx = Math.sin(a) * 195 - (b.cabV || 0) * 26;
      const ty = Math.cos(a) * 195 * (1 - Math.abs(Math.sin(a)) * 0.12);
      egCableStroke(c, 0, 0, tx, ty, Math.sin(a) * 26 - (b.cabV || 0) * 18);
      // the empty coupling, its lock light blinking for her
      c.save(); c.translate(tx, ty); c.rotate(a * 1.4 - (b.cabV || 0) * 0.3);
      c.fillStyle = '#4d545e'; c.fillRect(-5, -2, 10, 12);
      c.fillStyle = '#2c3138'; c.fillRect(-5, 5, 10, 2.5);
      c.save(); c.globalAlpha *= 0.5 + Math.max(0, Math.sin(b.anim * 5)) * 0.45;
      c.shadowColor = '#ff4c5c'; c.shadowBlur = 8;
      c.fillStyle = '#ff4c5c'; c.fillRect(-2, 9, 4, 4);
      c.restore();
      c.restore(); c.restore();
    }
    c.translate(cx, cy);
    c.scale(S, S);
    // Opaque body; confirmed contact flash is composited by foeDraw.
    if (b.st === 'dorm') c.globalAlpha *= 0.85;      // asleep on the line, dimmed
    if (b.st === 'intro') {
      // the waking shiver: it runs down the cable into her frame, hardest
      // just before the screech breaks
      const wk2 = Math.max(0, Math.min(1, 1 - (b.t || 0) / 2));
      c.translate((bossPoseNoise(b.anim, 21) - 0.5) * wk2 * 6, (bossPoseNoise(b.anim, 22) - 0.5) * wk2 * 3);
    }
    const t = b.anim;
    // while hung, the body tilts with the pendulum, plus a lean toward the
    // anchor when an attack has pulled her off plumb
    let tilt = 0, ax = 0, ay = -100;
    if (hang) {
      const slant = Math.atan2(cx - hangX, Math.max(40, cy - ancY));
      tilt = (b.cabA || 0) + Math.max(-0.16, Math.min(0.16, slant * 0.35));
      tilt = Math.max(-0.4, Math.min(0.4, tilt));
      ax = Math.sin(tilt) * 100; ay = -Math.cos(tilt) * 100;   // mount atop her back
      const lx = (hangX - cx) / S, ly = (ancY - cy) / S;
      egCableStroke(c, lx, ly, ax, ay, -(b.cabV || 0) * 14 + (lx - ax) * 0.1);
    }
    if (b.dead && !b.purified) {
      // powered down on the ground, light out, listing to one side
      const k = 1 - Math.max(0, Math.min(1, (b.deathAnimT || 0) / 1.6));
      egFigA(c, 'pRest', 1, 0.35 * k);
    } else if (b.st === 'idle' || b.st === 'dorm' || b.st === 'intro') {
      // the sheet's hanging figure, riding its cable's swing
      c.rotate(tilt + Math.sin(t * 1.3) * 0.018);
      egFigA(c, 'pIdle', 1, 0);
      egChestGlow(c, 0.55 + Math.sin(t * 3) * 0.2);
    } else if (b.st === 'volley') {

        c.translate((bossPoseNoise(b.anim, 23) - 0.5) * 3.4 * sh, (bossPoseNoise(b.anim, 24) - 0.5) * 1.6 * sh);
        c.rotate(tilt + Math.sin(t * (16 + 14 * a2)) * 0.014 * a2);

      } else {

let GLC_DRAW_TIME = 0;
// ===========================================================================
// GLACIERE, THE FROZEN PURIFIER â€” the corrupted unicorn of the void.
// Every pixel here is the owner's sheet: two full authored figures (the
// galloping hero pose for flight, the standing assembly for gathered
// moments), the parts row (which she SHATTERS INTO when she dies), and the
// authored effects â€” void lance, ice shards, nova crystals, void orbs.
// Nothing is guessed; the sheet is ground truth.
// ===========================================================================
const GLC_P = {
  hero: [6, 6, 610, 413],      // galloping flight pose (faces LEFT)
  head: [622, 6, 114, 129], neck: [742, 6, 63, 130], body: [811, 6, 192, 123],
  legF: [1009, 6, 68, 130], legH: [1083, 6, 71, 135], tail: [1160, 6, 136, 84],
  asm: [6, 425, 445, 294],     // standing assembly (faces LEFT)
  lance: [457, 425, 128, 43],
  shard1: [610, 427, 77, 36],  // one arrow from the authored fan
  novaCr: [693, 425, 85, 95],
  orb: [784, 425, 20, 25],
  // sub-rects of the HERO figure (sheet space) used for additive flow ghosts:
  // the void mane tendrils behind her head, and the crystal tail fan
  mane: [100, 10, 168, 162],
  tailW: [430, 230, 186, 155],
};
let GLC_PURE = false;             // drawGlaciere sets this from b.purified
let GLC_PURE_CV = undefined;
// purified sheet: the void purple leaves her â€” remapped to living ice
function glcPureAtlas(im) {
  if (GLC_PURE_CV !== undefined) return GLC_PURE_CV;
  // never cache before the sheet has decoded â€” a 0-size canvas is forever
  if (!im || !im.naturalWidth) return null;
  const cv = document.createElement('canvas');
  cv.width = im.naturalWidth; cv.height = im.naturalHeight;
  const x = cv.getContext('2d', { willReadFrequently: true });
  x.drawImage(im, 0, 0);
  let d;
  try { d = x.getImageData(0, 0, cv.width, cv.height); }
  catch (e) { return (GLC_PURE_CV = null); }
  const p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    const r = p[i], g = p[i + 1], b2 = p[i + 2];
    if (p[i + 3] > 60 && b2 > 120 && b2 - g > 40 && r - g > 5) {
      p[i] = Math.round(r * 0.45);
      p[i + 1] = Math.min(255, Math.round(b2 * 0.92));
      p[i + 2] = b2;
    }
  }
  x.putImageData(d, 0, 0);
  return (GLC_PURE_CV = cv);
}
function glcImg() {
  const im = typeof MEDIA_IMG !== 'undefined' ? ((typeof softArt === 'function' && softArt('glaciereParts')) || MEDIA_IMG.glaciereParts) : null;
  if (im && GLC_PURE) { const pv = glcPureAtlas(im); if (pv) return pv; }
  return im;
}

// draw one authored figure bottom-anchored in local space (art faces LEFT)
function glcFig(c, key, rot, shake, alpha) {
  const im = glcImg(); if (!im || !im.naturalWidth) return false;
  const s = GLC_P[key];

  if (shake) c.translate((bossPoseNoise(GLC_DRAW_TIME,3)*2-1)*shake, (bossPoseNoise(GLC_DRAW_TIME,7)*2-1)*shake);
  if (rot) c.rotate(rot);
  c.drawImage(im, s[0], s[1], s[2], s[3], -s[2] / 2, -s[3], s[2], s[3]);
  if (alpha == null || alpha >= 0.5) infEyeArt(c, 'glaciereParts:' + key, 0, -s[2] / 2, -s[3], s[2], s[3]);
  c.restore();

}

// the horn tip in hero-figure local space (art faces LEFT, bottom-anchored):
// measured off the sheet â€” the spiral horn ends near the top-left corner
function glcHornLocal() { return { x: -GLC_P.hero[2] * 0.44, y: -GLC_P.hero[3] * 0.94 }; }

// an additive ghost echo of a HERO-figure sub-rect, drawn at its authored
// position in hero-local space plus a phase offset â€” the classic way to sell
// the baked-in mane/tail motion without repainting a pixel of it
function glcGhost(c, r, dx, dy, alpha) {
  const im = glcImg(); if (!im || !im.naturalWidth) return;
  const h = GLC_P.hero;
  c.save();
  c.globalCompositeOperation = 'lighter';
  c.globalAlpha *= alpha;
  c.drawImage(im, r[0], r[1], r[2], r[3],
    r[0] - h[0] - h[2] / 2 + dx, r[1] - h[1] - h[3] + dy, r[2], r[3]);

// ---------------------------------------------------------------------------
// THE AIR-GALLOP RIG â€” her legs are no longer frozen in the baked gallop.
// The hero figure keeps its head, mane, body, spine crystals and tail, but
// the baked legs are lifted out and the sheet's own two leg pieces (front
// and hind, each a full hip-ball/knee-ball/hoof limb) are hung back on
// nested pivots â€” near and far pairs â€” cycling on NULLFANG's rotary-gallop
// clock. Idle she paddles slowly on the hover; the dash is a full gallop.
// ---------------------------------------------------------------------------
const GLC_CACHE = {};
// per-piece skeleton, measured off the sheet: hip and knee ball centres
const GLC_LEG = {
  legF: { hip: [26, 24], knee: [52, 57] },
  legH: { hip: [33, 20], knee: [55, 55] },

// hip anchors in hero-local space (origin bottom-centre, art faces LEFT):
// [f near, h near, f far, h far], each [x, y, part, scale]
const GLC_HIPS = [
  [-145, -135, 'legF', 1.12], [40, -113, 'legH', 0.9],
  [-127, -138, 'legF', 1.05], [56, -116, 'legH', 0.84],

// cool-shadowed atlas for the far pair, so depth reads
function glcDark() {
  const slot = GLC_PURE ? 'darkPure' : 'dark';
  if (GLC_CACHE[slot]) return GLC_CACHE[slot];

  const cv = document.createElement('canvas');
  cv.width = im.naturalWidth; cv.height = im.naturalHeight;

// whole tail chain survive untouched; rig legs hang over the cut
function glcHeroCut() {
  const slot = GLC_PURE ? 'heroCutPure' : 'heroCut';

  const s = GLC_P.hero;

  const x = cv.getContext('2d');

// one authored leg split at its knee ball â€” upper drives from the hip, the
// shank folds about the knee, overlapped 14 rows through the ball
function glcLegDraw(c, key, ax, ay, a1, a2, sc, dark) {
  const im = dark ? glcDark() : glcImg();
  if (!im || !(im.naturalWidth || im.width)) return;
  const s = GLC_P[key], L = GLC_LEG[key];
  const cutUp = Math.min(s[3], L.knee[1] + 7), cutLo = Math.max(0, L.knee[1] - 7);
  c.save();

    -L.hip[0] * sc, -L.hip[1] * sc, s[2] * sc, cutUp * sc);

// the assembled hero with living legs. gait is the accumulated clock phase,
// k 0..1 scales paddle â†’ full gallop, tuck 0..1 folds the legs up (the
// coiled dash tell). Falls back to the whole authored figure untouched.
function glcHeroRig(c, rot, shake, gait, k, tuck) {
  const cut = glcHeroCut();

  const s = GLC_P.hero;

  if (rot) c.rotate(rot);

function drawGlaciere(c, b) {
  GLC_DRAW_TIME = b.anim || 0;

    const fv = b.faceVis == null ? (b.face || 1) : b.faceVis;

    const ta = Math.max(0.001, Math.abs(fv));

    // drops below 0.85, the pivot crouches into the hooves, and the update
    // side kicks dust on the crossing frame
    c.translate(0, (1 - ta) * 6);

    // the standing assembly, dark and still â€” and RISES to hover height as
    // she wakes, the ignition timed to the roar

    const rE = clamp((wakeK - 0.4) / 0.5, 0, 1);
    const riseK = b.st === 'dorm' ? 0 : (b.st === 'intro' ? rE * rE * (3 - 2 * rE) : 1);

    c.save(); c.globalAlpha *= 0.22; c.fillStyle = '#04070b';
    c.beginPath(); c.ellipse(0, 2 + groundOff, 200 * (0.55 + 0.45 * riseK), 16, 0, 0, 7); c.fill(); c.restore();
    if (b.dead && !b.purified) {
      // DEATH: she breaks into the sheet's own parts row â€” and the pieces
      // FALL: gravity takes them, each bounces once on the floor line, and
      // they settle where they lie with dying spin. Nothing drifts forever.
      const fade = clamp(1 - ((b.glcDeathT || 0) - 1.6) / 1.1, 0, 1);
      for (const sh of b.glcShatter || []) {
        const sp = GLC_P[sh.pk];

        c.translate(sh.x, sh.y);

        c.drawImage(im, sp[0], sp[1], sp[2], sp[3], -sp[2] / 2, -sp[3] / 2, sp[2], sp[3]);

    // mane-frequency shimmer, and a bank rolled into her glide direction
    const bob = Math.sin(b.anim * 1.7) * 7 + Math.sin(b.anim * 4.6) * 2;
    const roll = clamp(vxV / 2600, -0.085, 0.085) * sgn;
    // the gait clock: her legs cycle faster the faster she actually moves â€”
    // a slow hover-paddle at rest, a full airborne gallop on the charge
    const spdG = Math.hypot(vxV, vyV);
    const gaitK = b.st === 'dash' ? 1 : clamp(spdG / 620, 0, 1);
    const gait = b.glcGait || 0;
    const pitch = clamp((b.vy || 0) / -1400, -0.16, 0.16) + Math.sin(b.anim * 1.1) * 0.022;
    c.translate(0, (-14 + bob) * riseK + groundOff);   // grounded â†’ riding the air

    const heroFig = !(b.st === 'novawarn' || b.st === 'orbs' || b.st === 'azhush'

      const br2 = Math.sin(b.anim * 0.9) * 0.006;

      c.restore();

      const hg = c.createRadialGradient(-150, -240, 1, -150, -240, 16);
      hg.addColorStop(0, 'rgba(240,160,255,' + (0.16 + Math.max(0, Math.sin(b.anim * 0.9)) * 0.12) + ')');
      hg.addColorStop(1, 'rgba(120,30,200,0)');
      c.fillStyle = hg; c.beginPath(); c.arc(-150, -240, 16, 0, 7); c.fill();
      c.restore();
    } else if (b.st === 'intro') {
      if (wakeK < 0.5) {
        // the stir: the sleeping figure trembles harder as the cold gathers,
        // easing back down from the dormant scale as she braces to lift
        const sc2 = 1.32 - (wakeK / 0.5) * 0.32;
        c.scale(sc2, sc2);
        glcFig(c, 'asm', 0.025 - wakeK * 0.05, wakeK * 4.5);
        // Rising frost is emitted by glaciereMotionTick, once per simulation step.
      } else {
        // IGNITION: she is airborne in the hero figure, the horn flaring
        // with the shriek, frost blown off the lift
        glcFig(c, 'hero', -0.05, (1 - wakeK) * 3);
        const hp2 = glcHornLocal();
        const fl = Math.max(0, 1 - Math.abs(wakeK - 0.62) / 0.3);
        if (fl > 0.01) {
          c.save(); c.globalCompositeOperation = 'lighter';
          const g = c.createRadialGradient(hp2.x, hp2.y, 2, hp2.x, hp2.y, 30 + fl * 70);
          g.addColorStop(0, 'rgba(240,190,255,' + 0.85 * fl + ')');
          g.addColorStop(0.5, 'rgba(190,80,240,' + 0.5 * fl + ')');
          g.addColorStop(1, 'rgba(120,30,200,0)');
          c.fillStyle = g; c.beginPath(); c.arc(hp2.x, hp2.y, 30 + fl * 70, 0, 7); c.fill();
          c.restore();
        }
      }
    } else if (b.st === 'daze') {
      // BROKEN OPEN (the hit-group break): out of the air and down on her
      // hooves on the ice â€” the standing assembly, grounded, head bowed. The
      // hover lift above is cancelled so the hooves meet the floor she fell
      // to; the jolt of the fall shakes out in the first third of a second.
      c.translate(0, 14 - bob);
      const into = Math.max(0, (b.dazeDur || 1.8) - (b.t || 0));
      glcFig(c, 'asm', 0.06, Math.max(0, 0.3 - into) * 8);
    } else if (b.st === 'recover') {
      // SPENT: she has sunk to your height and it shows â€” nose down, legs
      // hanging out of the gallop, the body heaving on a slow breath. The
      // opening has to LOOK open or nobody learns to take it.
      const br = Math.sin(b.anim * 4.2);
      const recoil = (b.glcRecoil || 0) ** 2;
      const stamp = (b.glcStamp || 0) ** 2;
      // Recoil belongs to the actual recovered action. The old draw-side
      // latch only played after idle; these moves now enter recover instead.
      c.translate(recoil * 20, 5 + br * 1.6 + stamp * 7);
      c.scale(1 + stamp * .08, 1 - stamp * .10);
      glcHeroRig(c, -0.1 + br * 0.012 + roll * 0.5 + recoil * .05, 0, gait, 0, 0.14);
    } else if (b.st === 'novawarn' || b.st === 'orbs' || b.st === 'azhush') {
      // gathered: the standing assembly, trembling as power collects
      glcFig(c, 'asm', 0, b.st === 'novawarn' ? 2 : 0.8);
    } else if ((b.glcStamp || 0) > 0 && b.st === 'idle') {
      // THE STAMP: the nova has just released â€” the standing figure drives
      // down into a squash beat and eases back to height
      const q = b.glcStamp * b.glcStamp;
      c.translate(0, 9 * q);
      c.scale(1 + 0.15 * q, 1 - 0.19 * q);
      glcFig(c, 'asm', 0, 0);
    } else if (b.st === 'dash') {
      // the charge: stretched into her own speed, nose into the line â€”
      // with a MOTION SMEAR of two fading authored copies hung along it
      for (let i = 2; i >= 1; i--) {
        c.save();
        c.translate(-(b.vx || 0) * 0.02 * i / sclX, -(b.vy || 0) * 0.02 * i / sclY);
        glcFig(c, 'hero', clamp((b.vy || 0) / 2200, -0.3, 0.3), 0, i === 1 ? 0.22 : 0.11);
        c.restore();
      }
      c.scale(1.07, 0.96);
      glcHeroRig(c, clamp((b.vy || 0) / 2200, -0.3, 0.3), 0, gait, 1, 0);
      // the tail crystals drag a wake of themselves through the line
      for (let i = 1; i <= 3; i++)
        glcGhost(c, GLC_P.tailW, i * 15 + Math.sin(b.anim * 9 - i * 1.1) * 5,
          Math.sin(b.anim * 7 - i * 1.4) * 6, 0.22 - i * 0.055);
    } else if (b.st === 'dashwarn') {
      // coiling, aimed â€” the tell: the legs GATHER UP under her as she loads
      const tk = clamp(1 - (b.t || 0) / 0.6, 0, 1);
      glcHeroRig(c, -0.06, 1.6, gait, 0, 0.4 + tk * 0.6);
    } else if (b.st === 'lancewarn' || b.st === 'shardwarn') {
      glcHeroRig(c, -0.03, 1.2, gait, 0.1, 0.35);
    } else {
      // LANCE RECOIL: the body is punched back a few px along the shot line
      // the instant the lance leaves, nose kicked up, settling as it decays
      const rq = (b.glcRecoil || 0) * (b.glcRecoil || 0);
      if (rq > 0.001) c.translate(rq * 26, 0);
      // DASH ARRIVAL: she overshoots the stop and springs back
      const st2 = b.glcSettle || 0;
      if (st2 > 0.001) {
        const w = Math.sin(st2 * 9) * st2 * st2;
        c.translate(w * -14, 0);
        c.scale(1 + w * 0.09, 1 - w * 0.07);
      }
      glcHeroRig(c, pitch + roll + rq * 0.07, 0, gait, gaitK, 0);
    }
    // VOID MANE FLOW: 2-3 additive ghost echoes of the authored tendrils,
    // offset on a phase wave â€” the baked mane appears to stream and coil
    if (heroFig) {
      const mph = b.anim * 3.2;
      for (let i = 1; i <= 3; i++)
        glcGhost(c, GLC_P.mane,
          i * 4 + Math.sin(mph - i * 0.8) * 4.5,
          Math.cos(mph - i * 1.1) * 3.5 - i * 1.5,
          0.15 - i * 0.033);
    }
    // horn charge glow: the lance tell builds at the horn tip
    if (b.st === 'lancewarn') {
      const hp2 = glcHornLocal();
      const k = clamp(1 - (b.t || 0) / 0.7, 0, 1);
      c.save(); c.globalCompositeOperation = 'lighter';
      const g = c.createRadialGradient(hp2.x, hp2.y, 2, hp2.x, hp2.y, 26 + k * 40);
      g.addColorStop(0, 'rgba(240,160,255,' + (0.5 + k * 0.5) + ')');
      g.addColorStop(0.5, 'rgba(190,80,240,' + (0.3 + k * 0.35) + ')');
      g.addColorStop(1, 'rgba(120,30,200,0)');
      c.fillStyle = g;
      c.beginPath(); c.arc(hp2.x, hp2.y, 26 + k * 40, 0, 7); c.fill();
      c.restore();
    }
    if (b.st === 'shardwarn') {
      // ice gathers along the spine crystals â€” the shard tell
      c.save(); c.globalCompositeOperation = 'lighter';
      c.globalAlpha *= 0.35 + Math.sin(b.anim * 16) * 0.2;
      const g = c.createRadialGradient(30, -300, 8, 30, -300, 150);
      g.addColorStop(0, 'rgba(165,216,255,0.5)'); g.addColorStop(1, 'rgba(165,216,255,0)');
      c.fillStyle = g; c.beginPath(); c.arc(30, -300, 150, 0, 7); c.fill();
      c.restore();
    }
    c.restore();
    return true;
  } catch (e) { c.restore(); return false; }
}

let DRG_DRAW_TIME = 0;

// ===========================================================================
// FURNACE CHOIR, THE ATLAS â€” the owner's CORRUPTED MECHA DRAGON.
// Every pixel here is the owner's sheet: three authored full poses (IDLE,
// WALK, FLY), the large flying hero figure (the dramatic states â€” the Forge
// Roar, the orb summoning, the meltdown), the parts column (which he BREAKS
// INTO when he dies, staggered â€” wings first, then the head, then the body
// drops), the glow core (the molten orb art) and the lava ring (his ground
// presence). Nothing is guessed; the sheet is ground truth.
// NOTE: this art faces RIGHT (GLACIERE's faces left â€” signs flip here).
// ===========================================================================
const DRG_P = {
  hero: [6, 6, 608, 541],       // large flying figure
  ring: [620, 6, 512, 96],      // molten lava ring (ground effect)
  idle: [1138, 6, 170, 165],    // grounded stand
  walk: [6, 553, 196, 168],     // grounded stride
  fly: [208, 553, 230, 168],    // airborne
  head: [444, 553, 140, 84], neck: [590, 553, 132, 107], body: [728, 553, 261, 125],
  flegR: [995, 553, 85, 118], flegL: [1086, 553, 79, 117],
  hlegR: [1171, 553, 86, 113], hlegL: [1263, 553, 70, 116],
  tail: [6, 727, 299, 75],
  wingR: [311, 727, 298, 239], wingL: [615, 727, 292, 238],
  core: [913, 727, 48, 60],     // glow core â€” the molten orb
};
const DRG_CACHE = {};
function drgImg() {
  if (typeof MEDIA_IMG === 'undefined') return null;
  return (typeof softArt === 'function' && softArt('dragonParts')) || MEDIA_IMG.dragonParts;
}

// white-hot copy of the atlas for the meltdown: the sheet's own pixels pushed
// toward #FFF5E0, crossfaded in by whiteHot/slag â€” never a painted-over glow
function drgHot() {
  if (DRG_CACHE.hot) return DRG_CACHE.hot;
  const im = drgImg(); if (!im || !im.naturalWidth) return null;
  const cv = document.createElement('canvas');
  cv.width = im.naturalWidth; cv.height = im.naturalHeight;
  const x = cv.getContext('2d');
  x.drawImage(im, 0, 0);
  x.globalCompositeOperation = 'source-atop';
  x.fillStyle = 'rgba(255,245,224,0.85)'; x.fillRect(0, 0, cv.width, cv.height);
  DRG_CACHE.hot = cv;

}

// one authored figure, bottom-anchored at the origin (art faces RIGHT).
// wk crossfades the white-hot copy over it.
function drgFig(c, key, wk, shake, rot, cool) {
  const im = drgImg(); const s = DRG_P[key];
  c.save();
  if (shake) c.translate(drgDrawRange(-shake, shake), drgDrawRange(-shake, shake) * 0.5);
  if (rot) { c.translate(0, -s[3] * 0.45); c.rotate(rot); c.translate(0, s[3] * 0.45); }
  c.drawImage(im, s[0], s[1], s[2], s[3], -s[2] / 2, -s[3], s[2], s[3]);
  // COOLED: the sheet's own pixels under the warm-shadow copy (drgDark) â€” the
  // light gone out of the furnace, which is how every opening reads
  if (cool > 0) {
    const dk = drgDark();
    if (dk) {
      c.save(); c.globalAlpha *= Math.min(1, cool);
      c.drawImage(dk, s[0], s[1], s[2], s[3], -s[2] / 2, -s[3], s[2], s[3]);
      c.restore();
    }
  }
  infEyeArt(c, 'dragonParts:' + key, 0, -s[2] / 2, -s[3], s[2], s[3]);
  if (wk > 0) {
    // capped crossfade: white-hot must READ as him glowing, never erase him
    const h = drgHot();
    if (h) {
      c.save(); c.globalAlpha *= Math.min(1, wk) * 0.5;
      c.drawImage(h, s[0], s[1], s[2], s[3], -s[2] / 2, -s[3], s[2], s[3]);
      c.restore();
    }
  }
  c.restore();
}

// ---------------------------------------------------------------------------
// THE STEPPING RIG â€” no more sliding stride pose. The walk figure keeps his
// body, wings, head and tail, but the baked legs are lifted out and the
// sheet's own four leg pieces are hung back on nested hip/knee pivots, so
// the walk is REAL steps: reach, plant, drive, fold. The gait clock is
// NULLFANG's rotary gallop â€” hind pair drives, front pair catches off-beat.
// ---------------------------------------------------------------------------
// per-piece skeleton, measured off the sheet: hip ball and knee ball centres
// in part-local px. Each piece is split at its knee so the shank folds.
const DRG_LEG = {
  flegR: { hip: [46, 20], knee: [70, 42] },
  flegL: { hip: [30, 20], knee: [56, 46] },
  hlegR: { hip: [20, 20], knee: [60, 44] },
  hlegL: { hip: [17, 18], knee: [46, 44] },
};
// hip anchors in walk-pose local space (origin feet-centre, art faces RIGHT):
// [f near, h near, f far, h far] â€” far pair sits deeper and darker
const DRG_HIPS = [[60, -70, 'flegR'], [-26, -68, 'hlegR'], [44, -72, 'flegL'], [-8, -70, 'hlegL']];
const DRG_LEGSC = 0.64;                          // leg pieces vs walk-pose art
// warm-shadowed atlas copy for the far pair, so depth reads
function drgDark() {
  if (DRG_CACHE.dark) return DRG_CACHE.dark;
  const im = drgImg(); if (!im || !im.naturalWidth) return null;
  const cv = document.createElement('canvas');
  cv.width = im.naturalWidth; cv.height = im.naturalHeight;
  const x = cv.getContext('2d');
  x.drawImage(im, 0, 0);
  x.globalCompositeOperation = 'source-atop';
  x.fillStyle = 'rgba(24,7,4,0.45)'; x.fillRect(0, 0, cv.width, cv.height);
  DRG_CACHE.dark = cv;
  return cv;
}
// the walk figure with its baked legs erased â€” the tail band survives whole.
// The rig legs hang over the cut, their hip balls tucked up into the belly.
function drgWalkCut(hot) {
  const slot = hot ? 'walkCutHot' : 'walkCut';
  if (DRG_CACHE[slot]) return DRG_CACHE[slot];
  const im = hot ? drgHot() : drgImg();
  if (!im || (im.naturalWidth === 0 && !im.getContext)) return null;
  const s = DRG_P.walk;
  const cv = document.createElement('canvas');
  cv.width = s[2]; cv.height = s[3];
  const x = cv.getContext('2d');
  x.drawImage(im, s[0], s[1], s[2], s[3], 0, 0, s[2], s[3]);
  x.globalCompositeOperation = 'destination-out';
  x.fillRect(80, 96, 116, 72);                  // the leg block right of the tail
  x.fillRect(35, 148, 45, 20);                  // the feet strip under the tail
  DRG_CACHE[slot] = cv;
  return cv;
}
// one authored leg split at its knee ball: the upper drives from the hip,
// the shank folds about the knee â€” both halves are the sheet's own pixels,
// overlapped 14 rows through the ball so the seam never shows mid-flex
function drgLegDraw(c, key, ax, ay, a1, a2, dark) {
  const im = dark ? drgDark() : drgImg();
  if (!im || !(im.naturalWidth || im.width)) return;
  const s = DRG_P[key], L = DRG_LEG[key], sc = DRG_LEGSC;
  const cutUp = Math.min(s[3], L.knee[1] + 7), cutLo = Math.max(0, L.knee[1] - 7);
  c.save();
  c.translate(ax, ay); c.rotate(a1);
  c.drawImage(im, s[0], s[1], s[2], cutUp,
    -L.hip[0] * sc, -L.hip[1] * sc, s[2] * sc, cutUp * sc);
  c.translate((L.knee[0] - L.hip[0]) * sc, (L.knee[1] - L.hip[1]) * sc);
  c.rotate(a2);
  c.drawImage(im, s[0], s[1] + cutLo, s[2], s[3] - cutLo,
    -L.knee[0] * sc, (cutLo - L.knee[1]) * sc, s[2] * sc, (s[3] - cutLo) * sc);
  c.restore();
}
// the assembled stepping walk: far pair, cut body, near pair â€” one gait beat
function drgWalkRig(c, ph, wk, shake, rot) {
  const cut = drgWalkCut(false);
  if (!cut) { drgFig(c, 'walk', wk, shake, rot); return; }
  const s = DRG_P.walk;
  c.save();
  if (shake) c.translate(drgDrawRange(-shake, shake), drgDrawRange(-shake, shake) * 0.5);
  if (rot) { c.translate(0, -s[3] * 0.45); c.rotate(rot); c.translate(0, s[3] * 0.45); }
  // ROTARY GALLOP timing, straight off NULLFANG: hind pair near-together,
  // front pair staggered, front vs hind NOT a clean half-cycle â€” the
  // off-beat is what reads as an animal instead of a wind-up toy
  const PH = [0, 1.18 * Math.PI, 0.42 * Math.PI, 1.46 * Math.PI];
  const legs = PH.map((p, i) => {
    const w = ph + p;
    // the hind pair carries the mass â€” it steps shallower and never folds
    // both feet off the ground at once; the front pair does the reaching
    const hind = i === 1 || i === 3 ? 0.72 : 1;
    return {
      // second harmonic: the reach snaps forward, drags back slower
      a1: (Math.sin(w) + 0.22 * Math.sin(w * 2 + 0.6)) * 0.26 * hind,
      // the knee folds hard on the swing-through, stays long in stance
      a2: (Math.sin(w + 1.25) * 0.55 + Math.max(0, Math.sin(w + 2.1)) * 0.5) * 0.42 * hind,
    };
  });
  drgLegDraw(c, DRG_HIPS[2][2], DRG_HIPS[2][0], DRG_HIPS[2][1], legs[2].a1, legs[2].a2, true);
  drgLegDraw(c, DRG_HIPS[3][2], DRG_HIPS[3][0], DRG_HIPS[3][1], legs[3].a1, legs[3].a2, true);
  c.drawImage(cut, -s[2] / 2, -s[3]);
  // the cut is the walk figure minus its legs, in the walk figure's frame:
  // its eye is the walk figure's (the stepping rig drew none â€”
  // tests/infection-roster found ATLAS walking with no eye at all)
  infEyeArt(c, 'dragonParts:walk', 0, -s[2] / 2, -s[3], s[2], s[3]);
  if (wk > 0) {
    const hcut = drgWalkCut(true);
    if (hcut) {
      c.save(); c.globalAlpha *= Math.min(1, wk) * 0.5;
      c.drawImage(hcut, -s[2] / 2, -s[3]);
      c.restore();
    }
  }
  drgLegDraw(c, DRG_HIPS[1][2], DRG_HIPS[1][0], DRG_HIPS[1][1], legs[1].a1, legs[1].a2, false);
  drgLegDraw(c, DRG_HIPS[0][2], DRG_HIPS[0][0], DRG_HIPS[0][1], legs[0].a1, legs[0].a2, false);
  c.restore();
}

// one death piece, centre-anchored
function drgPiece(c, key, sc) {

// mouth position per grounded pose, in art-local units (origin feet-centre)
const DRG_MOUTH = { idle: [62, -112], walk: [72, -116], fly: [92, -128] };

// his roost: a nest of slag and bent girders packed onto the high ledge.
// World-space and anchored â€” it stays where he built it after he leaves.
function drgNest(c, x, y, t) {
  c.save();
  c.translate(x, y);
  // heat shimmer banked in the bowl
  c.save(); c.globalCompositeOperation = 'lighter';
  const eg = c.createRadialGradient(0, -8, 2, 0, -8, 46);
  const ea = 0.14 + Math.max(0, Math.sin(t * 0.9)) * 0.08;
  eg.addColorStop(0, 'rgba(255,160,80,' + ea + ')'); eg.addColorStop(1, 'rgba(255,120,50,0)');
  c.fillStyle = eg; c.beginPath(); c.ellipse(0, -8, 70, 26, 0, 0, 7); c.fill();
  c.restore();
  // the bowl: three packed arcs of scrap, darkest deepest
  c.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    c.strokeStyle = ['#241a12', '#3a2a20', '#4a382a'][i];
    c.lineWidth = 13 - i * 3;
    c.beginPath();
    c.ellipse(0, -4 - i * 5, 74 - i * 10, 20 - i * 4, 0, 0.15 + i * 0.06, Math.PI - 0.15 - i * 0.06);
    c.stroke();
  }
  // bent girder ends poking from the weave
  c.strokeStyle = '#57453a'; c.lineWidth = 4;
  for (let i = 0; i < 6; i++) {
    const a = 0.4 + i * 0.45, r0 = 58 - (i % 2) * 12;
    c.beginPath();
    c.moveTo(Math.cos(a) * r0 * (i % 2 ? -1 : 1), -8 - Math.sin(a) * 12);

    c.fillRect(px, -10 - (i % 2) * 6, 3, 3);
  }
  c.restore();
}

// THE SLEEPING DRAGON â€” composed from his own authored parts the way a
// dragon actually sleeps: body flat on the ground, tail wrapped around the
// front, wings folded over the back like a tent, head down on a tucked
// forepaw. lift 0..1 is the stir: head and chest come off the ground first.
// Local space: ground at y=0, art faces RIGHT, caller has scaled/mirrored.
function drgSleep(c, t, lift) {
  const im = drgImg(); if (!im || (im.naturalWidth === 0 && !im.getContext)) return;
  const dk = drgDark();
  const pc = (key, x, y, rot, sc, sqx, sqy, dark) => {
    const s = DRG_P[key];
    c.save(); c.translate(x, y); if (rot) c.rotate(rot);
    c.scale(sqx || 1, sqy || 1);
    c.drawImage(dark && dk ? dk : im, s[0], s[1], s[2], s[3],
      -s[2] * sc / 2, -s[3] * sc / 2, s[2] * sc, s[3] * sc);
    c.restore();
  };
  const P2 = 0.42;
  const br = Math.sin(t * 0.75);                   // the slow sleeping breath
  c.save();
  c.translate(0, br * 1.3 * (1 - lift));
  // far wing: folded flat along the back, darkened for depth
  pc('wingL', -14, -58, 0.9, 0.2, 1, 0.55, true);
  // tail wrapped around the front of the body, lying on the ground
  pc('tail', -26, -13, 0.1, P2);
  // the body, belly on the ground
  pc('body', 0, -27, -0.02, P2, 1, 1 - br * 0.012);
  // near wing folded over it â€” the tent
  pc('wingR', 2, -54 - lift * 6, 1.0 - lift * 0.15, 0.24, 1, 0.5);
  // tucked forepaw, lying flat â€” the pillow
  pc('flegR', 46, -11, 1.35, P2 * 0.85);
  // neck and head: resting on the paw; the stir lifts them first
  pc('neck', 34, -30 - lift * 30, 0.55 - lift * 0.75, P2);
  pc('head', 58 - lift * 8, -15 - lift * 52, 0.6 - lift * 0.85, P2);
  // the banked chest ember, breathing under the plating
  drgGlow(c, 2, -26, 7 + lift * 16, 0.06 + Math.max(0, br) * 0.06 + lift * 0.35, false);
  c.restore();
}

// the marks his machine puts on the world (js/furnace-fight.js fcDrawFx: the
// drop's landing, the lock, the backdraft's cone) are gameplay, so they are
// drawn whether or not the sheet is in yet â€” under him and over him
function drawFurnace(c, b) {
  DRG_DRAW_TIME = b.anim || 0;
  if (typeof fcDrawFx === 'function') fcDrawFx(c, b, 'under');
  const ok = drawFurnaceBody(c, b);
  if (typeof fcDrawFx === 'function') fcDrawFx(c, b, 'over');
  return ok;
}
function drawFurnaceBody(c, b) {
  const im = drgImg(); if (!im || !im.naturalWidth) return false;
  c.save();
  try {

    if (b.nestX != null && !b.dead) drgNest(c, b.nestX, b.nestFootY, b.anim);
    const fc = b.fc || furnacePoseState(b);
    const S = (b.h * 1.9) / DRG_P.idle[3];         // grounded pose scale
    const HR = (b.h * 2.6) / DRG_P.hero[3] / S;    // hero figure, relative
    const PS = 0.34;                               // death pieces vs pose art
    const cx = b.x + b.w / 2, footY = b.y + b.h;
    const fv = b.faceVis == null ? (b.face || 1) : b.faceVis;
    const sgn = fv >= 0 ? 1 : -1;                  // authored art faces RIGHT
    const ta = Math.max(0.001, Math.abs(fv));
    const wk = b.slag ? 1 : (b.whiteHot || 0);
    c.translate(cx, footY);
    // THE TURN LAW, tier 3: no authored front exists, so the flex floor is
    // 0.85, the pivot crouches into the feet, and the update side kicks dust
    // on the crossing frame
    c.translate(0, (1 - ta) * 6);
    c.scale(sgn * (0.85 + 0.15 * ta) * S, (1 - (1 - ta) * 0.05) * S);
    // Keep armour solid; foeDraw supplies the bounded confirmed-hit flash.

    // ---- DEATH: he breaks into the sheet's own parts, staggered â€” wings
    // tear free first, the head drops next, the legs buckle, the body falls
    if (b.dead && !b.purified) {
      // phase 1: the whole machine shudders as the seams let go
      const preT = 0.35;
      if (fc.deadT < preT) {
        drgFig(c, 'idle', wk + (1 - fc.deadT / preT) * 0.4, 2.5 + fc.deadT * 6);
        drgGlow(c, 0, -75, 60, 0.5, true);
        c.restore(); return true;

      const fade = clamp(1 - (fc.deadT - 2.0) / 0.9, 0, 1);
      c.globalAlpha *= fade;

      const order = ['wingL', 'tail', 'hlegL', 'flegL', 'neck', 'head', 'hlegR', 'flegR', 'body', 'wingR'];
      for (const key of order) {
        const p = (fc.shatter || []).find(q => q.k === key);
        if (!p) continue;
        const live = fc.deadT - preT >= p.delay;
        c.save();
        c.translate(p.x, p.y); c.rotate(p.rot);
        if (!live) c.translate(drgDrawRange(-1.5, 1.5), drgDrawRange(-1, 1));   // straining
        drgPiece(c, key, PS);
        c.restore();
      }
      // the heat leaves him: embers rising off the wreck
      c.restore(); return true;
    }

    // ---- ground presence: the authored lava ring, breathing under him ----
    // banked while he sleeps; it catches as the wake reaches ignition
    const wakeK2 = b.st === 'intro' ? clamp(1 - (b.t || 0) / 2, 0, 1) : (b.st === 'dorm' ? 0 : 1);
    const ringGate = b.st === 'dorm' ? 0 : b.st === 'intro' ? (b.nestLanded ? 1 : 0) : 1;
    const grounded = Math.abs(b.vy || 0) < 120;
    // The ring is DECORATION PAINTED ON THE FLOOR, spreading 20 px below his
    // feet, so it is exactly what G.artProbe exists to switch off (entities.js).
    // It was never gated because the old plate's lower half was too dim to pass

    if (grounded && ringGate > 0.01 && !G.artProbe && !FC_AIR[b.st]) {

      const hotStat = b.st === 'hymn' || b.st === 'forgebell' || b.st === 'meltwarn';
      const ra = (0.2 + Math.sin(b.anim * 2.6) * 0.07 + (hotStat ? 0.22 : 0) + wk * 0.25) * ringGate;
      const rw2 = 95, rh2 = 15;

      c.translate(0, 4);

    } else if (b.st === 'ventwarn' || b.st === 'vent') {

      // that throws the fire (the cone itself is fcDrawFx's, in world space)
      const warm = b.st === 'ventwarn';
      const dur = b.phase === 2 ? FC.ventTell2 : FC.ventTell;
      const k = warm ? clamp(1 - (b.t || 0) / dur, 0, 1) : 1;
      c.save();
      if (warm) {
        c.translate(-8 * k, 0);
        c.scale(1 - 0.1 * k, 1 + 0.1 * k);
        drgFig(c, 'idle', wk, 0.4 + k * 1.6 + shk, -0.14 * k);
      } else {
        c.translate(12, 2);
        drgFig(c, 'idle', wk, 1.4 + shk, 0.14);

      c.restore();
      drgGlow(c, warm ? 18 : 34, -82, 12 + k * 30, 0.3 + k * 0.5, !warm || k > 0.6);
    } else if (b.st === 'dropcrouch' || FC_AIR[b.st]) {
      // THE DROP: the authored FLY figure. Gathered on the ground (the wings
      // up, the body sunk onto the haunches) is the tell; on the wing over
      // her it tracks; locked it holds and shakes; then it falls nose-first.
      if (b.st === 'dropcrouch') {
        const k = clamp(1 - (b.t || 0) / FC.dropTell, 0, 1);
        c.scale(1 + 0.06 * k, 1 - 0.14 * k);
        drgFig(c, 'fly', wk, k * 1.6 + shk, 0.05 + 0.06 * k);
      } else if (b.st === 'dive') {
        c.scale(0.94, 1.08);
        drgFig(c, 'fly', wk, 0.8 + shk, 0.32);
      } else {
        const lock = b.st === 'droplock';
        c.translate(0, lock ? 0 : Math.sin(b.anim * 18) * 2);
        drgFig(c, 'fly', wk, (lock ? 1.2 : 0) + shk, lock ? 0.12 : -0.08);
      }

      // THE FORGE ROAR / ORB SUMMONING / MELTDOWN: the sheet's large flying
      // figure â€” he rears onto the air, wings spread, and the foundry answers
      let k = 0;
      if (b.st === 'hymn') k = clamp(1 - (b.t || 0) / 1.0, 0, 1);
      else if (b.st === 'forgebell') k = clamp(1 - (b.t || 0) / 1.35, 0, 1);
      else if (b.st === 'meltwarn') k = wk;
      else k = 1;
      const wind = (b.windT || 0) > 0 ? 1.4 : 0;
      c.save();
      c.translate(0, -(4 + k * 9) + Math.sin(b.anim * 3.2) * 2);
      c.scale(HR, HR);
      drgFig(c, 'hero', wk, wind + shk, -0.04 - k * 0.05);
      // THE TELL'S OWN LIGHT. The reared figure is twice his standing height,
      // so the shared wash behind him (Boss.draw) covers a fraction of it, and
      // tests/artbible.cjs measured the hymn's wind-up at 17.9% amber against
      // a 10.6% rest â€” under the +8 the bible asks for. While the bells (or the
      // forge bell) wind up, the upper body takes the warning colour itself.
      if ((b.st === 'hymn' || b.st === 'forgebell') && k > 0 && !b.dead) {
        c.save(); c.globalCompositeOperation = 'lighter';
        const tg = c.createRadialGradient(80, -300, 12, 80, -300, 290);
        tg.addColorStop(0, 'rgba(255,194,74,' + (0.22 + 0.4 * k) + ')');
        tg.addColorStop(0.55, 'rgba(255,194,74,' + (0.1 + 0.22 * k) + ')');
        tg.addColorStop(1, 'rgba(255,194,74,0)');
        c.fillStyle = tg; c.beginPath(); c.ellipse(80, -300, 290, 250, 0, 0, 7); c.fill();
        c.restore();
      }
      // the mouth: heat gathers through the windup, flashes on every peal
      const mp = fc.pulseT > 0 ? fc.pulseT / 0.25 : 0;
      drgGlow(c, 266, -292, 22 + k * 22 + mp * 24, 0.35 + k * 0.3 + mp * 0.5, mp > 0.4);
      // core flare under the chest plating
      drgGlow(c, 40, -230, 30 + Math.sin(b.anim * 6) * 5 + k * 14, 0.25 + k * 0.25, false);
      // wing-flap gusts on the peals (cosmetic wind, no new damage)
      if (mp > 0.25) {
        c.save(); c.globalCompositeOperation = 'lighter';
        c.lineCap = 'round';
        for (let i = 0; i < 2; i++) {
          const gy2 = -250 - i * 70, sw2 = (1 - mp) * 110;
          const gg = c.createLinearGradient(-200 - sw2, 0, -60 - sw2, 0);
          gg.addColorStop(0, 'rgba(255,215,106,0)');
          gg.addColorStop(0.6, 'rgba(255,215,106,' + (0.34 * mp) + ')');
          gg.addColorStop(1, 'rgba(255,215,106,0)');
          c.strokeStyle = gg; c.lineWidth = 7;
          c.beginPath(); c.moveTo(-200 - sw2, gy2 + i * 16);

        }
        c.restore();
      }
      c.restore();
    } else if (b.st === 'slamwarn' || fc.slamT > 0) {
      // TAIL SLAM. The warn coils the authored tail overhead â€” that is the
      // tell â€” then it cuts to planted-in-the-ground with NO smear between.
      const warm = b.st === 'slamwarn';
      const wt = warm ? clamp(1 - (b.t || 0) / 0.55, 0, 1) : 1;
      c.translate(0, warm ? 3 : (fc.slamT > 0.3 ? 5 : 2));
      drgFig(c, 'idle', wk, (warm ? 0.6 + wt * 1.8 : 0.8) + shk, warm ? -0.07 : 0.05);
      // the authored tail piece, rooted at the rump

      let ang;
      if (warm) ang = -0.5 - wt * 1.45;                        // coils overhead
      else if (fc.slamT > 0.2) ang = 0.52;                     // PLANTED
      else ang = 0.52 - (1 - fc.slamT / 0.2) * 0.9;            // pulls out

      if (!warm && fc.slamT < 0.08) c.globalAlpha *= fc.slamT / 0.08;
      c.translate(-45, -58); c.rotate(ang);
      if (warm && wt > 0.6) c.translate(drgDrawRange(-1.5, 1.5), drgDrawRange(-1.5, 1.5));
      c.drawImage(im, ts[0], ts[1], ts[2], ts[3], -8, -ts[3] * PS * 0.5, ts[2] * PS, ts[3] * PS);

      c.restore();
      occl(c, -45, -52, 14, 8, 0.4);

    } else if (!grounded) {
      // airborne: the authored FLY pose, nose riding the arc
      drgFig(c, 'fly', wk, shk, clamp((b.vy || 0) / 2400, -0.22, 0.22));
    } else if (Math.abs(b.vx || 0) > 20) {
      // the WALK pose with a weighty gait: the body sinks onto each planted
      // side and every footfall kicks dust and a 1px shake
      const ph = fc.gait || 0;
      // Weight flexes about the planted feet; it does not lift the whole body.
      const sink = Math.abs(Math.sin(ph)) * .015;

      drgWalkRig(c, ph, wk, shk, Math.sin(ph) * 0.035);
    } else {
      // stand: breathing, the core light swelling and settling
      c.scale(1, 1 + Math.sin(b.anim * 1.8) * .006);
      drgFig(c, 'idle', wk, shk, Math.sin(b.anim * 1.8) * 0.012);
    }

    // grounded overlays -----------------------------------------------------
    // ...and the openings keep the light OUT of the bell: the slumped picture
    // is "hit it now", and a live core over it would read as a breath drawn
    const slumped = b.st === 'daze' || b.st === 'stagger' || (b.st === 'recover' && (b.recMv === 'vent' || b.recMv === 'drop'));
    const fcOwn = slumped || b.st === 'ventwarn' || b.st === 'vent' || b.st === 'dropcrouch' || FC_AIR[b.st];
    if (!heroPose && !fcOwn && b.stagT <= 0 && b.st !== 'dorm' && b.st !== 'intro') {
      const mk2 = DRG_MOUTH[!grounded ? 'fly' : (Math.abs(b.vx || 0) > 20 ? 'walk' : 'idle')];
      // FIREBALL tell: heat climbs into the mouth as the lob comes due
      if (b.st === 'idle' && (b.t || 0) < 0.6 && !b.hymn && !b.slag)
        drgGlow(c, mk2[0], mk2[1], 10 + (1 - b.t / 0.6) * 12, 0.25 + (1 - b.t / 0.6) * 0.4, false);
      // late hymn peals flash the mouth even after he has resumed walking
      if (fc.pulseT > 0 && b.hymn)
        drgGlow(c, mk2[0], mk2[1], 16 + fc.pulseT * 60, 0.3 + fc.pulseT * 1.6, true);
      // chest core, always alive
      drgGlow(c, 12, -78, 14 + Math.sin(b.anim * 5) * 2.5 + wk * 10, 0.16 + wk * 0.3, false);
    }
    c.restore();
    return true;
  } catch (e) { c.restore(); return false; }
}

// the authored GLOW CORE as the summoned molten orb (forgebell reskin):

// violet-grey armor shell, virus tendrils, the cyan-to-red halo) sits in the
// cold dark bands so the single golden CORE reads as the only living thing
// in the room. One key light, upper-left, for every solid surface; the core
// itself is the second, warm, local light and rims the shell from inside â€”
// that inner gold edge is what welds the composition together.
//
// She has no facing. She is RADIAL: the turn law is satisfied by radial
// symmetry â€” there is no flip to police. Life comes from asymmetry of
// DETAIL: per-plate drift phases, staggered eye blinks, one worn plate.
//
// Everything moves on one shared heartbeat (~0.9 Hz) that accelerates as
// her HP falls: core swell, halo spikes, plate breathing.

  // the shell ramp: cool violet-grey, hue-shifted (never grey-by-black)

// raw wedge); the outer edge carries a raised crest with a hard spike â€” the
// silhouette breaker that keeps the shell from reading as a closed ring.
function mvPlatePath(c, r0, r1, w0, w1, spike) {
  c.beginPath();

  const rm = r0 + (r1 - r0) * 0.5;
  c.quadraticCurveTo(Math.cos(-w0 * 0.6) * rm, Math.sin(-w0 * 0.6) * rm,
    Math.cos(-w1) * r1, Math.sin(-w1) * r1);                        // concave side
  c.arc(0, 0, r1, -w1, -0.1);                                       // outer edgeâ€¦
  c.lineTo(r1 + spike, -1.8); c.lineTo(r1 + spike + 3, 0); c.lineTo(r1 + spike, 1.8); // â€¦crest spike

// ===========================================================================
// THE AUTHORED SHEET. Twenty painted parts, cut out of one plate and rigged
// against the motion this file already computes.
//
// She is RADIAL, which is what makes a sheet work here at all: one plate,
// drawn eight times around a circle, IS the shell â€” and drawing the same
// plate eight times is what keeps the ring symmetrical in a way eight
// separately painted plates never would be. The art on the sheet is oriented
// pointing LEFT-ish with its spikes up, so every draw rotates it into its
// sector and the whole body is built from a handful of rects.
// ===========================================================================
const MVA = {

  crack: [326, 360, 177, 216], crack2: [505, 360, 181, 216],
  collar: [2, 360, 322, 220],
  haloCR: [2, 582, 526, 196], haloR: [2, 780, 522, 184],
  coreS: [2, 966, 125, 118], coreB: [688, 360, 238, 215], coreD: [526, 780, 145, 148],
  tend1: [2, 2, 133, 356], tend2: [287, 2, 138, 340], tend3: [137, 2, 148, 356],
  stub: [129, 966, 155, 108],
  shard1: [673, 780, 108, 143], shard2: [783, 780, 100, 136], shard3: [491, 966, 101, 75],
  shard4: [885, 780, 116, 120], shard5: [286, 966, 115, 96], shard6: [403, 966, 86, 88],

// one part, centred on the current origin, at a given angle and pixel height

  const im = mvArt(); if (!im) return;

  c.restore();
}

// on top of the core. `eye` (a plate's sector index) reports that plate's
// lens to the infection: HER EYES ARE THE SHELL'S LENSES, one per plate â€” the
// core is a sun with no pupil, her light and her weak point, not an eye
// (tools/eyespecs.cjs says how that was decided).

  c.rotate(spin || 0);

  c.drawImage(im, r[0], r[1], r[2], r[3], -w / 2, -h / 2, w, h);

  // light her up in the one move whose point is that she cannot be seen
  if (eye != null && (alpha == null || alpha >= 0.3) && typeof infEyeArt === 'function')

  c.restore();

function mvArtBody(c, b, P) {
  const { tt, dd, beat, hpFrac, ph, dorm, charging, dark, song, stag, grabbing, hurt, targA, cy } = P;
  // ---- void aura: unchanged in spirit, she is still a hole in the world ----
  if (!dark) {
    const deathFade = b.dead ? mvClamp(1 - dd / 1.8, 0, 1) : 1;
    const ag = c.createRadialGradient(0, 0, 20, 0, 0, 132);
    ag.addColorStop(0, 'rgba(26,10,26,' + 0.5 * deathFade + ')');
    ag.addColorStop(0.65, 'rgba(20,8,22,' + 0.26 * deathFade + ')');
    ag.addColorStop(1, 'rgba(13,13,18,0)');

  }

  const dissK = b.dead ? mvClamp((dd - 0.5) / 1.0, 0, 1) : 0;

      gg.addColorStop(0, 'rgba(255,215,106,' + 0.5 * bright * (1 - deadCore) + ')');

  // memory the painted parts take over â€” but nothing above this line changes:
  // the heartbeat, the halo's fall, the plate-loss order, the reach of the
  // tendrils and the collapse of the core are all still the numbers this file
  // already worked out. Only what gets painted is different.
  // It must answer TRUE: Boss.draw treats a falsy answer as "her art is not

  // and two stand-in eyes â€” straight over the body that was just drawn.

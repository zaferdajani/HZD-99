function themeId() {
  // a build can be LOCKED to one game (two separate libraries: the cat's
  // CLAWBYTE page and the hero's NOSTOS page each ship with their own lock)
  const lock = (typeof window !== 'undefined' && window.GAME_LOCK) || null;
  if (typeof G !== 'undefined' && G.state) {
    const s = G.state;
    // the shell (title menu / chooser / language) wears the locked worldâ€¦
    if (s === 'MENU' || s === 'WHO' || s === 'LANGSEL') return lock || 'robo';
    // â€¦and once a character is chosen, the difficulty screen previews THAT world
    if (s === 'DIFF') return G.pendTheme || lock || 'robo';
  }
  return (typeof G !== 'undefined' && G.save && G.save.theme) || lock || 'robo';
}
function isHero() { return themeId() === 'hero'; }

// CLAWBYTE â€” the shared material sheet and sensor ladder.
//
// Taken straight off the boss design sheets, which specify both. Every machine in
// the Depths is built from the same five materials, and every one of them carries
// the same four-state sensor: cyan while it is still itself, crimson once the Null
// Signal has it. That is what makes the faction read as one faction, and it is
// also the fix for the old art's real problem â€” one flat gradient smeared over
// every surface regardless of what the surface was made of or which way it faced.

const MAT = {
  // white ceramic: warm off-white, chipped and stained. The armour material.
  ceramic: { lit: '#f8f4ec', mid: '#b6b0a3', dark: '#5f5a51', deep: '#302d28' },
  // brushed steel: cool, mid-value, low specular. Frames and pistons.
  steel:   { lit: '#a8b2bc', mid: '#5f6a75', dark: '#333b43', deep: '#1b2127' },
  // oxidized bronze: warm, dirty gold. Joints, collars, fittings.
  bronze:  { lit: '#dcb268', mid: '#9a7638', dark: '#5c4520', deep: '#332711' },
  // cyan light: uncorrupted power. Never on an infected sensor.
  cyan:    { lit: '#c9fbff', mid: '#3fd8ee', dark: '#1b7d92', deep: '#0a3540' },
  // crimson corruption: the broadcast. Only ever this.
  crimson: { lit: '#ff8a90', mid: '#ff2f43', dark: '#7e1018', deep: '#3a060c' },
  // molten metal: the Foundry only.
  molten:  { lit: '#ffe0a8', mid: '#ff7a22', dark: '#8a2c08', deep: '#3d1203' },
  // frosted glass: the Archives only.
  frost:   { lit: '#f0fbff', mid: '#c2dee8', dark: '#6d8b98', deep: '#33454e' },
};

// A ramp whose axis you choose, so a surface facing away from the light can be
// shaded differently from one facing into it. Pass the light direction per part.
function ramp(c, m, x0, y0, x1, y1, k) {
  const g = c.createLinearGradient(x0, y0, x1, y1);
  m = { lit: m.lit, mid: m.mid, dark: m.dark || m.mid, deep: m.deep || m.dark || m.mid };
  const s = k == null ? 1 : k;               // k<1 dims the whole part (facing away)
  const mix = (a, b, t) => {
    const p = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
    const A = p(a), B = p(b);
    return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')';
  };
  g.addColorStop(0, s >= 1 ? m.lit : mix(m.lit, m.dark, 1 - s));
  g.addColorStop(0.5, s >= 1 ? m.mid : mix(m.mid, m.dark, 1 - s));
  g.addColorStop(1, s >= 1 ? m.dark : mix(m.dark, m.deep, 1 - s));
  return g;
}

// contact/occlusion shadow between two parts. Its absence is what made the old
// art read as pieces pasted onto each other.
function occl(c, x, y, w, h, a) {
  const g = c.createRadialGradient(x, y, 0, x, y, Math.max(w, h));
  g.addColorStop(0, 'rgba(6,10,14,' + (a == null ? 0.55 : a) + ')');
  g.addColorStop(1, 'rgba(6,10,14,0)');
  c.save(); c.fillStyle = g;
  c.beginPath(); c.ellipse(x, y, w, h, 0, 0, 7); c.fill();
  c.restore();
}

// ---------------------------------------------------------------------------
// The sensor ladder: IDLE -> ALERT -> LOCKED -> OVERDRIVE.
// Cyan means the machine is still running its own orders. Crimson means the
// broadcast is driving. The state IS the telegraph, so a player can read what a
// boss is about to do from its eye alone.
// ---------------------------------------------------------------------------
// Escalation is carried by brightness, ring count and spin â€” NOT by hue. Hue
// carries infection: crimson if the broadcast has it, cyan if it does not. Running
// the ladder cyan-to-red would have meant infected bosses idling in friendly
// colours, which contradicts STORY.md's one hard rule and costs the player the
// read that red means danger.
const SENSOR = {
  idle:      { blur: 5,  rings: 1, spin: 0.4, pulse: 0.10, k: 0.55 },
  alert:     { blur: 10, rings: 2, spin: 1.6, pulse: 0.30, k: 0.78 },
  locked:    { blur: 15, rings: 2, spin: 3.0, pulse: 0.45, k: 1 },
  overdrive: { blur: 23, rings: 3, spin: 6.0, pulse: 0.75, k: 1 },
};
function sensorState(e) {
  if (!e) return 'idle';
  if (e.overdriveT > 0 || e.phase >= 2) return 'overdrive';
  if (e.windT > 0 || e.stagT > 0) return 'locked';
  if (e.st && e.st !== 'dorm' && e.st !== 'intro') return 'alert';
  return 'idle';
}
// one eye, drawn the same way everywhere, so the whole faction speaks one language
// clean === true means the machine was never corrected, so it keeps its own light
function drawSensor(c, x, y, r, state, t, clean) {
  const S = SENSOR[state] || SENSOR.idle;
  const m = clean ? MAT.cyan : MAT.crimson;
  const p = 1 + Math.sin(t * (2 + S.spin)) * S.pulse;
  c.save(); c.translate(x, y);
  // recessed housing, so the lens sits IN the plate rather than on it
  c.fillStyle = MAT.steel.deep;
  c.beginPath(); c.arc(0, 0, r * 1.5, 0, 7); c.fill();
  occl(c, 0, 0, r * 1.7, r * 1.7, 0.5);
  c.fillStyle = m.dark;
  c.beginPath(); c.arc(0, 0, r * 1.15, 0, 7); c.fill();
  // the light
  c.save();
  c.globalAlpha = 0.45 + S.k * 0.55;
  c.shadowColor = m.mid; c.shadowBlur = S.blur * p;
  c.fillStyle = S.k >= 1 ? m.mid : m.dark;
  c.beginPath(); c.arc(0, 0, r * p, 0, 7); c.fill();
  c.fillStyle = S.k >= 1 ? m.lit : m.mid;
  c.beginPath(); c.arc(0, 0, r * 0.44 * p, 0, 7); c.fill();
  c.restore();
  c.shadowBlur = 0;
  // targeting rings â€” they multiply and spin as it escalates
  c.globalAlpha = 0.4 + S.k * 0.6;
  c.strokeStyle = m.mid; c.lineWidth = Math.max(0.6, r * 0.13);
  for (let i = 0; i < S.rings; i++) {
    const rr2 = r * (1.5 + i * 0.55), a0 = t * S.spin + i * 1.1;
    c.beginPath(); c.arc(0, 0, rr2, a0, a0 + 1.5); c.stroke();
    c.beginPath(); c.arc(0, 0, rr2, a0 + Math.PI, a0 + Math.PI + 1.5); c.stroke();
  }
  c.restore();
}

// crimson tendrils â€” the corruption overlay the sheets show on every overdrive
// state. Drawn from an anchor, so it reads as growing OUT of the machine.
function tendrils(c, n, len, t, seed, alpha) {
  c.save();
  c.globalAlpha = alpha == null ? 0.9 : alpha;
  c.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const base = (seed || 0) + i * 2.399;
    const a = base + Math.sin(t * 1.7 + i) * 0.5;
    c.strokeStyle = i % 3 ? MAT.crimson.mid : MAT.crimson.lit;
    c.shadowColor = MAT.crimson.mid; c.shadowBlur = 8;
    c.lineWidth = 2.2 - (i % 3) * 0.5;
    c.beginPath(); c.moveTo(0, 0);
    let px = 0, py = 0;
    for (let k = 1; k <= 3; k++) {
      const kk = k / 3, aa = a + Math.sin(t * 2.3 + i + k) * 0.55 * kk;
      px += Math.cos(aa) * len * 0.34; py += Math.sin(aa) * len * 0.34;
      c.lineTo(px, py);
    }
    c.stroke();
  }
  c.shadowBlur = 0; c.restore();
}

// chipped-edge wear: ceramic in the Depths is never clean. Cheap, and it is the
// difference between "moulded plastic" and "a thing that has been working for a
// century".
function wear(c, pts, seed) {
  c.save(); c.fillStyle = 'rgba(58,55,48,0.5)';
  for (let i = 0; i < pts.length; i++) {
    const [x, y, s] = pts[i];
    c.beginPath(); c.moveTo(x, y); c.lineTo(x + s, y + s * 0.6); c.lineTo(x + s * 0.3, y + s); c.closePath(); c.fill();
  }
  c.restore();
}


// ---------------------------------------------------------------------------
// Turning in 2D.
//
// A machine authored in profile cannot turn by scaling its width to zero: that
// squashes it to a sliver and pops out the mirror image. It is a flip, not a
// turn. The design sheets give FRONT, SIDE and 3/4 for exactly this reason, so a
// turn should pass THROUGH the front view:
//
//     side-left  ->  3/4-left  ->  FRONT  ->  3/4-right  ->  side-right
//
// turnPose maps the eased facing to which authored pose to draw, plus how far
// into it we are, so the 3/4 can be built by narrowing the profile and revealing
// the front-facing parts underneath.
// ---------------------------------------------------------------------------
function turnPose(u) {
  const a = Math.abs(u), dir = u < 0 ? -1 : 1;
  if (a >= 0.66) return { pose: 'side',  dir, t: 1 };
  if (a >= 0.20) return { pose: 'q',     dir, t: (a - 0.20) / 0.46 };   // 0..1 toward side
  return          { pose: 'front', dir, t: a / 0.20 };                   // 0..1 toward 3/4
}

// ===========================================================================
// THE PRISM PROWLER â€” boss 5, the rival robo-cat. The one machine the network
// never indexed, so the broadcast never touched it: no virus, no wear, no
// crimson. A sleek cat chassis with a faceted crystal torso riding a glowing
// TURNTABLE â€” a disc it literally turns on, which is how it changes facing.
//
// Shape language: triangles over a long horizontal silhouette (danger, speed).
// Palette: cyan #37ffd0 (emissive), arc-violet #b48cff, prism white #e0e0ff,
// body #2a2a4a. Emissive is rationed: the eyes, the disc engravings, and the
// prism tail-tip that splits white light into a tiny spectrum. One deliberate
// asymmetry: the near ear has a chipped facet.
//
// Authored nose-LEFT, ground y=0, origin under the disc centre â€” same local
// convention as every other machine. drawPrism(c, b) returns true when it
// drew, so Boss.draw can keep its fallback chain.
// ===========================================================================

// ---------------------------------------------------------------------------
// AUTHORED ATLAS. The owner's PRISM sheet carries both halves of the character:
// the virus-lit red cat it fights as, and the clear blue cat underneath. That
// means the purification needs no hue remap here â€” it simply changes which half
// of the sheet we read from, which is why this boss looks right where a tinted
// copy of the infected art never would.
//
// Rects are [sx, sy, sw, sh] into assets/characters/prism_parts.png, with an
// optional 5th flag for the handful the artist drew facing left. Everything
// else is nose-RIGHT and gets mirrored on facing.
// ---------------------------------------------------------------------------
const PRZ_FR = {
  i_dorm: [[702, 739, 186, 81], [543, 739, 157, 82]],
  i_idle: [[592, 165, 106, 118], [425, 295, 146, 113]],
  i_walk: [[849, 295, 135, 110], [573, 295, 118, 113], [317, 295, 106, 114], [834, 165, 95, 117], [700, 165, 132, 118], [124, 526, 154, 105]],
  i_run: [[166, 295, 149, 115], [693, 295, 154, 113], [356, 414, 159, 109], [583, 635, 174, 96]],
  i_roar: [[210, 2, 118, 145], [506, 2, 187, 133], [695, 2, 160, 129]],
  i_slash: [[2, 2, 206, 161]],
  i_burst: [[177, 165, 217, 123]],
  i_beam: [[330, 2, 174, 142, 1]],
  i_spin: [[2, 165, 173, 128]],
  i_hurt: [[396, 165, 194, 120]],
  i_death: [[2, 835, 208, 79]],
  p_idle: [[442, 526, 112, 104], [187, 635, 120, 101]],
  p_walk: [[641, 414, 147, 107], [2, 414, 114, 110], [118, 414, 105, 110], [225, 414, 129, 110], [790, 414, 140, 107], [517, 414, 122, 108]],
  p_run: [[704, 526, 122, 103], [2, 526, 120, 107], [828, 526, 141, 102], [173, 739, 189, 91]],
  p_play: [[280, 526, 160, 105], [556, 526, 146, 104], [2, 635, 183, 102], [309, 635, 152, 100], [463, 635, 118, 98], [364, 739, 177, 88]],
  p_stretch: [[2, 739, 169, 94], [759, 635, 153, 95]],
  p_loaf: [[212, 835, 128, 75]],
  p_turn: [[2, 295, 162, 117]],
};
// the standing reference the artist drew at: every frame shares one world
// scale off this, so a lying cat stays smaller than a rearing one
const PRZ_REF_H = 118;

function przImg() {
  const im = (typeof MEDIA_IMG !== 'undefined') ? ((typeof softArt === 'function' && softArt('prismParts')) || MEDIA_IMG.prismParts) : null;
  return (im && im.naturalWidth) ? im : null;
}

// which drawing the cat is in right now
function przClip(b) {
  const t = b.anim || 0, st = b.st, R = PRZ_FR;
  const seq = (a, hz) => a[Math.floor(Math.abs(t) * hz) % a.length];
  const spd = Math.abs(b.vx || 0);

  if (b.purified) {
    // THE HANDOFF. Her film ends with the freed cat rolled onto its back,
    // paws in the air, batting at its own tail crystal â€” so the game comes out
    // of the cutscene in exactly that pose and holds it before drifting into
    // the normal idle. A cut is invisible when both sides of it agree.
    const pt = b.pureT || 0;
    if (pt < 0.5) return R.p_turn[0];        // body cleared, tail still red
    if (pt < 3.2) return seq(R.p_play, 3.4); // belly-up, exactly where the film left off
    if (spd > 240) return R.p_run[Math.floor((b.przStride || 0)*R.p_run.length)%R.p_run.length];
    if (spd > 34) return R.p_walk[Math.floor((b.przStride || 0)*R.p_walk.length)%R.p_walk.length];
    // left alone it behaves like a cat with nothing left to guard: it rolls on
    // its back batting at its own tail crystal, stretches, then loafs
    const cyc = (t * 1) % 17;
    if (cyc < 4.6) return seq(R.p_play, 3.6);
    if (cyc < 6.4) return seq(R.p_stretch, 2.4);
    if (cyc < 10) return R.p_loaf[0];
    return seq(R.p_idle, 1.3);
  }
  if (b.dead) return R.i_death[0];
  if ((b.stagT || 0) > 0 || st === 'daze') return R.i_hurt[0];   // the break wears the hurt plate
  if (st === 'dorm') return seq(R.i_dorm, 0.42);
  if (st === 'intro') return seq(R.i_roar, 5.5);
  if (st === 'dashwarn') return R.i_idle[1];    // low, lengthwise load
  if (st === 'pouncewarn') return R.i_run[1];    // folded haunches, paws planted
  if (st === 'spreadwarn') return R.i_roar[0]; // raised chest; not another crouch
  if (st === 'arcspin') return R.i_spin[0];
  if (st === 'dashslash') return R.i_slash[0];
  if (st === 'lsvanish' || st === 'lsarrive') return R.i_burst[0];
  if (st === 'beam' || st === 'aim') return R.i_beam[0];
  if (st === 'pounce') return b.vy < -120 ? R.i_run[3] : b.vy > 150 ? R.i_run[0] : R.i_run[2];
  if (st === 'rest' && (b.przLandT || 0) > 0) return R.i_run[1];
  if (spd > 240) return R.i_run[Math.floor((b.przStride || 0) * R.i_run.length) % R.i_run.length];
  if (spd > 34) return R.i_walk[Math.floor((b.przStride || 0) * R.i_walk.length) % R.i_walk.length];
  return seq(R.i_idle, 1.5);
}

// Authored-art path. Returns false when the sheet has not decoded yet, so the
// procedural cat below keeps the boss on screen from the very first frame.
function drawPrismSheet(c, b) {
  const im = przImg(); if (!im) return false;
  const f = przClip(b); if (!f) return false;
  const [sx, sy, sw, sh, art] = f;

  const cx = b.x + b.w / 2, footY = b.y + b.h;
  const fv = b.faceVis == null ? (b.face || 1) : b.faceVis;
  const ta = Math.max(0.001, Math.abs(fv));
  const dir = (fv < 0 ? -1 : 1) * (art ? -1 : 1);   // sheet is nose-RIGHT
  // PRISM's hitbox is the smallest of any boss â€” it is a fast rival cat, not a
  // siege engine â€” so the art is drawn well proud of it. The tail crystal sits
  // in the upper part of every frame, which is why the reference height buys
  // less body than the number suggests.
  const S = (b.h * 1.95) / PRZ_REF_H;
  const dw = sw * S, dh = sh * S;

  // breath and the settle after a landing, in world pixels
  const breath = (b.st === 'dorm' || b.dead) ? 0 : Math.sin((b.anim || 0) * 2.2) * .006;

  c.save();
  // contact shadow, so a painted sprite still sits on the floor
  c.save();
  c.globalAlpha = 0.32; c.fillStyle = '#000';
  c.beginPath(); c.ellipse(cx, footY - 1, dw * 0.30, dh * 0.055, 0, 0, 7); c.fill();
  c.restore();

  c.translate(cx, footY);
  c.scale(1, 1 + breath);
  // the turn is a real squash through the vertical, matching the turntable
  c.scale(dir * (0.88 + 0.12 * ta), 1);
  c.drawImage(im, sx, sy, sw, sh, -dw / 2, -dh, dw, dh);
  infEyeArt(c, 'prismParts@' + sx + ',' + sy, 0, -dw / 2, -dh, dw, dh);

  // the hit frame: the crystal takes the light straight through, so the whole
  // cat lifts towards white for an instant, punched through its own alpha
  const hurt = b.hurtT || 0;
  if (hurt > 0) {
    c.save();
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = Math.min(0.7, hurt * 3.5);
    c.drawImage(im, sx, sy, sw, sh, -dw / 2, -dh, dw, dh);
    c.restore();
  }
  c.restore();
  return true;
}

const PRZ = {
  // crystal body: cool indigo ramp, hue-shifted (never black-mixed)
  body:  { lit: '#a8aee2', mid: '#565b96', dark: '#2a2a4a', deep: '#131328' },
  // prism white: the facet material that catches the light
  white: { lit: '#ffffff', mid: '#e0e0ff', dark: '#8d90c4', deep: '#40426a' },
  // arc violet: coils, facet seams, inner ear
  viol:  { lit: '#e6d8ff', mid: '#b48cff', dark: '#6a4bb8', deep: '#2c1d58' },
  // clean cyan: the only boss whose light was never corrected
  cyan:  { lit: '#d8fff4', mid: '#37ffd0', dark: '#14a184', deep: '#063a30' },
};
const PRZ_SPEC = ['#ff5e6a', '#ffc95e', '#7dff9a', '#37ffd0', '#5ea8ff', '#b48cff'];

// ---- torso facet mesh: vertices then triangles, so the crystal is a real
// faceted solid whose planes catch the light at different ramp angles.
// Long and LOW, but carried clear of the disc so the legs read. ----
const PRZ_V = [
  [-26, -18], [-4, -16], [18, -17],            // 0-2 keel: chest low, belly, rear
  [-31, -27], [-7, -25], [25, -26],            // 3-5 midline
  [-23, -34], [1, -37], [19, -34],             // 6-8 spine: shoulder, arch, haunch
  [29, -20],                                   // 9 haunch point (rear silhouette break)
];
const PRZ_F = [
  [3, 0, 1], [3, 1, 4], [4, 1, 2], [4, 2, 5],
  [3, 4, 6], [6, 4, 7], [7, 4, 5], [7, 5, 8],
  [5, 2, 9], [8, 5, 9],
];

// slow cat blink: mostly open, a 0.24s sweep every ~3.5s
function przBlink(t) {
  const c2 = (t % 3.5);
  return c2 < 0.24 ? 1 - 0.94 * Math.sin(c2 / 0.24 * Math.PI) : 1;
}

// one jagged arc of coil lightning between two points
function przBolt(c, x0, y0, x1, y1, seed, amp, alpha) {
  c.save(); c.globalCompositeOperation = 'lighter';
  c.globalAlpha *= alpha;
  c.strokeStyle = PRZ.cyan.lit; c.lineWidth = 1.2;
  c.shadowColor = PRZ.cyan.mid; c.shadowBlur = 7;
  c.beginPath(); c.moveTo(x0, y0);
  for (let i = 1; i < 7; i++) {
    const k = i / 7;
    const nx = x0 + (x1 - x0) * k + Math.sin(seed * 37 + i * 9.7) * amp;
    const ny = y0 + (y1 - y0) * k + Math.cos(seed * 51 + i * 7.3) * amp;
    c.lineTo(nx, ny);
  }
  c.lineTo(x1, y1); c.stroke();
  c.shadowBlur = 0; c.restore();
}

// ---- pose: every state resolved into a small set of numbers ----
function przPose(b) {
  const t = b.anim, st = b.st;
  const P = {
    bob: Math.sin(t * 2.2) * 1.4, crouch: 0, pitch: 0,
    stretchX: 1, stretchY: 1, spin: 0,
    headA: 0, headUp: 0, earFlat: 0, eyeK: przBlink(t), pupilW: 1,
    tailLift: 0.6 + Math.sin(t * 1.6) * 0.12, tailWave: Math.sin(t * 2.3) * 3,
    facetK: 1, glow: 0.7, pant: 0, groom: 0, sit: 0, lick: 0,
    legs: [0, 0, 0, 0],                       // fore-near, fore-far, hind-near, hind-far
    discSpin: 0.9, rings: 0, coil: 0.12, sprawl: 0,
  };
  if (b.dead) return P;
  if (b.stagT > 0 || st === 'daze') {          // a stagger and the hit-group break share one body
    // fell off the disc after the storm: flat on its side, light guttering
    P.sprawl = 1; P.crouch = 13; P.stretchY = 0.72; P.pitch = 0.05;
    P.headA = 0.35; P.eyeK = 0.15; P.facetK = 0.5; P.glow = 0.25;
    P.tailLift = 0.02; P.tailWave = Math.sin(t * 1.1) * 1.5;
    P.discSpin = 0.2; P.pant = 1; P.bob = 0;
    P.legs = [-0.8, 0.9, 1, 1];
    return P;
  }
  if (st === 'dorm') {
    // pre-fight: an actual cat. It alternates grooming and a weight-shifted
    // sit, and never looks like it is waiting for a fight to start.
    const cyc = t % 11;
    if (cyc < 4.2) {                          // groom: paw up, head down, licking
      const k = Math.min(1, cyc / 0.5, (4.2 - cyc) / 0.5);
      P.groom = k; P.lick = Math.max(0, Math.sin(t * 7)) * k;
      P.headA = 0.38 * k + Math.sin(t * 7) * 0.05 * k;
      P.legs[0] = -1.3 * k;                   // near forepaw raised to the cheek
      P.crouch = 2 * k;
    } else {                                  // sit: haunch settles, chest rises
      const k = Math.min(1, (cyc - 4.2) / 0.9);
      P.sit = k; P.crouch = 2 * k;
      P.tailLift = 0.06; P.tailWave = Math.sin(t * 1.3) * 2;
      P.headUp = 3 * k;
    }
    P.discSpin = 0.35; P.glow = 0.45;
    return P;
  }
  if (st === 'intro') {
    P.crouch = 2; P.headA = -0.06; P.glow = 1;
    P.tailLift = 1.05; P.tailWave = Math.sin(t * 9) * 4;
    P.discSpin = 3;
    return P;
  }
  if (st === 'idle') {
    P.glow = 0.85;
    P.tailWave = Math.sin(t * 5) * 3.5;       // tail cutting the air: intent
    if ((b.t || 0) < 0.16) {                  // anticipation: flatten before striking
      P.crouch = 5; P.stretchY = 0.9; P.stretchX = 1.05; P.earFlat = 0.55;
      P.pupilW = 0.5;
    }
    return P;
  }
  if (st === 'dashslash') {
    // flatten, then the whole cat SPINS on its own axis â€” a blade of light
    const k = clamp(1 - (b.t || 0) / 0.42, 0, 1);
    P.spin = k * Math.PI * 4;
    P.stretchX = 1.1; P.stretchY = 0.8; P.crouch = 6;
    P.earFlat = 1; P.eyeK = 0.35; P.glow = 1.2;
    P.tailLift = 0.15; P.discSpin = 14; P.legs = [1.1, 1.1, 1.1, 1.1];
    return P;
  }
  if (st === 'pounce') {
    const dive = clamp((b.vy || 0) / 1300, -0.38, 0.42);
    P.pitch = dive; P.bob = 0; P.crouch = -2;
    P.legs = [-1, -0.8, 0.9, 0.75];           // forepaws reaching, hind driving
    P.earFlat = 1; P.glow = 1.1; P.pupilW = 0.5;
    P.tailLift = 1.15; P.tailWave = Math.sin(t * 10) * 3;
    P.stretchX = 1.06; P.discSpin = 5;
    return P;
  }
  if (st === 'rest') {
    // spent: panting vibration, facets dim, eyes half-lidded
    P.pant = 1; P.crouch = 6; P.eyeK = Math.min(P.eyeK, 0.45);
    P.facetK = 0.55; P.glow = 0.3; P.earFlat = 0.3;
    P.tailLift = 0.12; P.tailWave = Math.sin(t * 1.4) * 2;
    P.discSpin = 0.4;
    return P;
  }
  if (st === 'arcspin') {
    // the turntable screams up to speed under a cat pressed flat against it
    const k = clamp(1 - (b.t || 0) / 1.2, 0, 1);
    P.crouch = 9; P.stretchY = 0.84; P.earFlat = 1;
    P.eyeK = 1; P.pupilW = 0.4; P.glow = 1.3;
    P.discSpin = 2 + k * 42; P.rings = k; P.coil = 0.4 + k * 0.6;
    P.tailLift = 0.08; P.legs = [0.8, 0.8, 0.8, 0.8];
    return P;
  }
  if (st === 'arcstorm') {
    P.crouch = 10; P.stretchY = 0.8; P.earFlat = 1;
    P.eyeK = 1; P.pupilW = 0.35; P.glow = 1.4;
    P.discSpin = 48; P.rings = 1; P.coil = 1;
    P.tailLift = 0.06; P.legs = [0.8, 0.8, 0.8, 0.8];
    return P;
  }
  return P;
}

// sample the tail curve: two joined quadratics making a cat's S
function przTailPts(P) {
  const lift = P.tailLift, wob = P.tailWave, sit = P.sit;
  // root at the haunch; sitting wraps it low around the flank instead
  const p0 = [24, -24];
  const c1 = sit ? [34, -12] : [37, -22 + wob * 0.4];
  const m = sit ? [30, -8] : [41, -32 - lift * 8 + wob * 0.6];
  const c2 = sit ? [22, -6] : [44, -42 - lift * 10 + wob];
  const p1 = sit ? [12, -7] : [39, -50 - lift * 12 + wob * 1.4];
  const q = (a, b2, c3, k) => [
    (1 - k) * (1 - k) * a[0] + 2 * (1 - k) * k * b2[0] + k * k * c3[0],
    (1 - k) * (1 - k) * a[1] + 2 * (1 - k) * k * b2[1] + k * k * c3[1]];
  const pts = [];
  for (let i = 0; i <= 3; i++) pts.push(q(p0, c1, m, i / 3));
  for (let i = 1; i <= 3; i++) pts.push(q(m, c2, p1, i / 3));
  return pts;
}

// ---- the cat body, in authored (nose-left) local space ----
function przBody(c, b, P, fv) {
  const t = b.anim;
  const dim = P.facetK;

  // ---- tail first (behind the body): tapered S-curve to a prism tip ----
  {
    const pts = przTailPts(P);
    for (let i = 0; i < pts.length - 1; i++) {
      const k = i / (pts.length - 2);
      c.strokeStyle = k < 0.5 ? PRZ.body.dark : PRZ.viol.dark;
      c.lineWidth = 3.6 - k * 2.1; c.lineCap = 'round';
      c.beginPath(); c.moveTo(pts[i][0], pts[i][1]); c.lineTo(pts[i + 1][0], pts[i + 1][1]); c.stroke();
    }
    // the prism tip: a small crystal wedge that SPLITS light
    const tip = pts[pts.length - 1], prev = pts[pts.length - 2];
    const ta2 = Math.atan2(tip[1] - prev[1], tip[0] - prev[0]);
    c.save(); c.translate(tip[0], tip[1]); c.rotate(ta2);
    c.fillStyle = ramp(c, PRZ.white, -2, -3, 3, 3, dim);
    c.beginPath(); c.moveTo(-2, -3); c.lineTo(4.5, 0); c.lineTo(-2, 3); c.closePath(); c.fill();
    // the split: a tiny spectrum fanning out of the point
    c.save(); c.globalCompositeOperation = 'lighter';
    for (let i = 0; i < PRZ_SPEC.length; i++) {
      const a = -0.5 + i / (PRZ_SPEC.length - 1);
      c.globalAlpha = (0.4 + Math.sin(t * 3 + i) * 0.15) * Math.max(0.35, P.glow);
      c.strokeStyle = PRZ_SPEC[i]; c.lineWidth = 1.3;
      c.beginPath(); c.moveTo(3.5, 0);
      c.lineTo(3.5 + Math.cos(a) * 6.5, Math.sin(a) * 6.5); c.stroke();
    }
    c.restore(); c.restore();
  }

  // ---- far legs (dimmer, behind the torso) ----
  przLeg(c, -18, -26, P.legs[1], P, 0.6, t, 1);
  przLeg(c, 16, -25, P.legs[3], P, 0.6, t, 3);

  // ---- faceted crystal torso ----
  const V = PRZ_V;
  // backing fill (deepest tone) so facet seams never show the background
  c.beginPath();
  c.moveTo(V[3][0], V[3][1]); c.lineTo(V[6][0], V[6][1]); c.lineTo(V[7][0], V[7][1]);
  c.lineTo(V[8][0], V[8][1]); c.lineTo(V[9][0], V[9][1]); c.lineTo(V[2][0], V[2][1]);
  c.lineTo(V[1][0], V[1][1]); c.lineTo(V[0][0], V[0][1]); c.closePath();
  c.fillStyle = PRZ.body.deep; c.fill();
  // each facet plane catches the light at its own angle â€” and the angle
  // breathes with facing and time, so the crystal glitters as he moves
  for (let i = 0; i < PRZ_F.length; i++) {
    const [a, bq, cq] = PRZ_F[i];
    const mx = (V[a][0] + V[bq][0] + V[cq][0]) / 3, my = (V[a][1] + V[bq][1] + V[cq][1]) / 3;
    const fa = i * 1.7 + fv * 0.9 + Math.sin(t * 1.1 + i * 2.1) * 0.35;
    const k = (0.42 + 0.58 * Math.max(0, Math.cos(fa))) * dim;
    const mat = i % 3 === 2 ? PRZ.viol : PRZ.body;
    c.fillStyle = ramp(c, mat, mx - Math.cos(fa) * 9, my - Math.sin(fa) * 9,
      mx + Math.cos(fa) * 9, my + Math.sin(fa) * 9, k);
    c.beginPath(); c.moveTo(V[a][0], V[a][1]); c.lineTo(V[bq][0], V[bq][1]);
    c.lineTo(V[cq][0], V[cq][1]); c.closePath(); c.fill();
  }
  // additive facet seams (never black-lined)
  c.save(); c.globalCompositeOperation = 'lighter';
  c.globalAlpha = 0.15 * dim; c.strokeStyle = PRZ.white.mid; c.lineWidth = 0.8;
  for (const [a, bq, cq] of PRZ_F) {
    c.beginPath(); c.moveTo(V[a][0], V[a][1]); c.lineTo(V[bq][0], V[bq][1]);
    c.lineTo(V[cq][0], V[cq][1]); c.closePath(); c.stroke();
  }
  c.restore();
  // rim light: a short bright arc on the lit (upper-left) spine only, lost at
  // both ends â€” never a glass-dome outline
  c.save(); c.globalCompositeOperation = 'lighter';
  const rg = c.createLinearGradient(V[3][0], V[3][1], V[7][0], V[7][1]);
  rg.addColorStop(0, 'rgba(224,224,255,0)');
  rg.addColorStop(0.45, 'rgba(255,255,255,' + (0.5 * dim) + ')');
  rg.addColorStop(1, 'rgba(224,224,255,0)');
  c.strokeStyle = rg; c.lineWidth = 1.6; c.lineCap = 'round';
  c.beginPath(); c.moveTo(V[3][0] + 1, V[3][1]); c.lineTo(V[6][0], V[6][1] - 0.5);
  c.lineTo(V[7][0], V[7][1] - 0.5); c.stroke();
  c.restore();
  // panting: the flank vibrates
  if (P.pant) {
    c.save(); c.globalAlpha = 0.25 + Math.sin(t * 15) * 0.15;
    c.strokeStyle = PRZ.white.dark; c.lineWidth = 1;
    const pk = Math.sin(t * 14) * 1.4;
    c.beginPath(); c.moveTo(-8, -17 - pk); c.quadraticCurveTo(4, -14 - pk, 15, -18 - pk); c.stroke();
    c.restore();
  }

  // ---- near legs ----
  przLeg(c, -23, -26, P.legs[0], P, 1, t, 0);
  przLeg(c, 21, -25, P.legs[2], P, 1, t, 2);

  // ---- neck wedge: the head sits ON something, not beside it. Wide enough
  // that no background shows between the jaw and the chest. ----
  const hx = -29, hy = -36 - P.headUp;
  c.beginPath();
  c.moveTo(V[6][0] + 5, V[6][1] - 2);          // shoulder top
  c.lineTo(hx + 9, hy - 5);
  c.lineTo(hx - 2, hy + 10);
  c.lineTo(V[0][0] + 2, V[0][1] + 2);          // chest keel
  c.closePath();
  c.fillStyle = ramp(c, PRZ.body, hx, hy + 6, V[6][0], V[6][1], 0.9 * dim);
  c.fill();

  // ---- head: a wedge with concave cheeks, seated INTO the neck ----
  c.save();
  c.translate(hx, hy);
  c.rotate(P.headA);
  const HS = 1.3;                              // the head carries the character
  c.scale(HS, HS);
  // far ear first (rooted inside the skull)
  przEar(c, -3, -7.5, -0.22, 0.5 * dim, false, P.earFlat);
  // skull â€” lit clearly (it must never read darker than the torso)
  c.beginPath();
  c.moveTo(-13, 1);                            // nose tip
  c.quadraticCurveTo(-11, -5, -5, -8);         // muzzle bridge up
  c.lineTo(4, -9.5);                           // forehead
  c.quadraticCurveTo(10, -8, 11, -3);          // back of skull
  c.lineTo(9, 4);                              // jaw back
  c.quadraticCurveTo(2, 7, -3, 5.5);           // jowl
  c.quadraticCurveTo(-9, 5, -13, 1);           // concave cheek line to the nose
  c.closePath();
  const hgr = c.createLinearGradient(-11, -9, 8, 6);
  hgr.addColorStop(0, PRZ.body.lit); hgr.addColorStop(0.5, PRZ.body.mid); hgr.addColorStop(1, PRZ.body.dark);
  c.fillStyle = hgr;
  c.save(); if (dim < 1) c.globalAlpha *= 0.75 + dim * 0.25; c.fill(); c.restore();
  if (dim < 0.8) { c.fillStyle = 'rgba(19,19,40,' + (0.8 - dim) + ')'; c.fill(); }
  // cheek facet: a violet plane under the eye â€” structure, not sticker
  c.fillStyle = ramp(c, PRZ.viol, -8, 0, 2, 6, 0.55 * dim);
  c.beginPath(); c.moveTo(-10, 0.5); c.lineTo(-1, 0); c.lineTo(2, 5.5); c.quadraticCurveTo(-4, 6.5, -10, 0.5);
  c.closePath(); c.fill();
  // brow + muzzle plane breaks (additive, structural)
  c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = 0.3 * dim;
  c.strokeStyle = PRZ.white.mid; c.lineWidth = 0.9;
  c.beginPath(); c.moveTo(-11, -3.5); c.lineTo(-4, -6.5); c.lineTo(4, -7.5); c.stroke();
  c.restore();
  // muzzle facet: prism white chin wedge
  c.fillStyle = ramp(c, PRZ.white, -13, 0, -6, 6, 0.85 * dim);
  c.beginPath(); c.moveTo(-13, 1); c.lineTo(-7, 1.5); c.lineTo(-5, 5.5); c.quadraticCurveTo(-9, 5, -13, 1);
  c.closePath(); c.fill();
  // nose: a tiny violet triangle
  c.fillStyle = PRZ.viol.mid;
  c.beginPath(); c.moveTo(-13.4, 0.2); c.lineTo(-10.6, -0.6); c.lineTo(-11, 1.8); c.closePath(); c.fill();
  // whiskers: three hair-thin light lines off the muzzle â€” pure cat
  c.save(); c.globalCompositeOperation = 'lighter';
  c.globalAlpha = 0.35 * dim; c.strokeStyle = PRZ.white.mid; c.lineWidth = 0.5;
  for (let i = 0; i < 3; i++) {
    const wa = 0.12 + i * 0.24;
    c.beginPath(); c.moveTo(-9.5, 1.5 + i * 0.8);
    c.quadraticCurveTo(-14, 1 + i * 1.4 + wa, -18, 0.5 + i * 2.2 + wa * 2); c.stroke();
  }
  c.restore();
  // the licking tongue during grooming
  if (P.lick > 0.1) {
    c.save(); c.globalAlpha = P.lick * 0.9;
    c.fillStyle = PRZ.cyan.mid;
    c.beginPath(); c.ellipse(-11.5, 3.5 + P.lick * 2, 1.3, 2.4, 0.5, 0, 7); c.fill();
    c.restore();
  }
  // near ear â€” with the chipped facet (the one asymmetry)
  przEar(c, 4.5, -8, 0.14, dim, true, P.earFlat);
  // head rim, lit side only
  c.save(); c.globalCompositeOperation = 'lighter';
  const hg = c.createLinearGradient(-12, -6, 6, -9);
  hg.addColorStop(0, 'rgba(255,255,255,0)');
  hg.addColorStop(0.5, 'rgba(255,255,255,' + 0.45 * dim + ')');
  hg.addColorStop(1, 'rgba(255,255,255,0)');
  c.strokeStyle = hg; c.lineWidth = 1.1;
  c.beginPath(); c.moveTo(-11, -4.5); c.quadraticCurveTo(-6, -8, 4, -9); c.stroke();
  c.restore();
  // THE EYE: wide, cyan, alive. Blinks slowly; pupil narrows when hunting.
  {
    const open = clamp(P.eyeK, 0.04, 1);
    infEyeMark(c, -5.2, -2.6);
    c.save(); c.translate(-5.2, -2.6);
    c.scale(1, open);
    c.shadowColor = PRZ.cyan.mid; c.shadowBlur = 8 * P.glow;
    c.fillStyle = PRZ.cyan.mid;
    c.beginPath(); c.moveTo(-4.8, 0.2); c.quadraticCurveTo(-1, -3.8, 4.2, -0.7);
    c.quadraticCurveTo(0.5, 3.4, -4.8, 0.2); c.closePath(); c.fill();
    c.shadowBlur = 0;
    c.fillStyle = PRZ.cyan.lit;
    c.beginPath(); c.arc(-1.6, -0.6, 1.2, 0, 7); c.fill();
    // slit pupil
    c.fillStyle = PRZ.body.deep;
    c.beginPath(); c.ellipse(0.5, 0, 0.8 * P.pupilW, 1.8, 0, 0, 7); c.fill();
    c.restore();
  }
  c.restore();
}

// one thin crystal leg: shoulder anchor, crystal knee joint, paw on the disc.
// bend < 0 raises the paw (grooming / pounce reach); bend > 0 folds it.
function przLeg(c, ax, ay, bend, P, depth, t, idx) {
  const near = depth >= 1;
  const groundY = -7 + Math.min(P.crouch, 6) * 0.3;
  c.save();
  if (!near) c.globalAlpha *= 0.7;
  const col = near ? PRZ.body.dark : PRZ.body.deep;
  const sway = P.sprawl ? (idx % 2 ? 1 : -1) : Math.sin(t * 1.8 + idx * 1.9) * 0.05;
  let kx, ky, px2, py2;
  if (P.sprawl) {                              // knocked flat: legs out sideways
    const d = idx < 2 ? -1 : 1;
    kx = ax + d * 6; ky = groundY - 2;
    px2 = ax + d * 12; py2 = groundY;
  } else if (bend < -0.5) {                    // raised: paw up toward the cheek
    const k = -bend;
    kx = ax - 3; ky = ay + 7 - k * 3;
    px2 = ax - 7 * k; py2 = ay + 6 - 11 * k;
    if (P.groom) py2 += Math.sin(t * 7) * 1.6; // the paw rides the licking rhythm
  } else if (bend > 0.5) {                     // folded flat (spin/crouch)
    kx = ax + 3; ky = groundY - 4;
    px2 = ax + (idx < 2 ? -5 : 5); py2 = groundY;
  } else {
    kx = ax + sway * 6 + bend * 5; ky = (ay + groundY) / 2 + 2;
    px2 = ax + sway * 9 + bend * 9; py2 = groundY;
    if (P.sit) {
      if (idx >= 2) { kx = ax + 5; ky = groundY - 3.5; px2 = ax + 1; py2 = groundY; }
      else { kx = ax - 1; ky = (ay + groundY) / 2; px2 = ax - 1; py2 = groundY; }
    }
  }
  c.strokeStyle = col; c.lineCap = 'round';
  c.lineWidth = near ? 2.7 : 2.1;
  c.beginPath(); c.moveTo(ax, ay + 3); c.lineTo(kx, ky); c.stroke();
  c.lineWidth = near ? 2.3 : 1.8;
  c.beginPath(); c.moveTo(kx, ky); c.lineTo(px2, py2); c.stroke();
  // crystal knee joint: a small quiet diamond (only the near legs sparkle)
  if (near) {
    c.save(); c.translate(kx, ky); c.rotate(0.785);
    c.globalAlpha *= 0.8;
    c.fillStyle = ramp(c, PRZ.white, -1.5, -1.5, 1.5, 1.5, 0.7 * P.facetK);
    c.fillRect(-1.5, -1.5, 3, 3);
    c.restore();
  }
  // paw wedge
  c.fillStyle = col;
  c.beginPath(); c.moveTo(px2 - 2.8, py2 + 1); c.lineTo(px2 + 3, py2 + 1);
  c.lineTo(px2 + 0.8, py2 - 2.4); c.closePath(); c.fill();
  c.restore();
}

// triangular crystal ear, concave outer edge, rooted INTO the skull;
// chip = the asymmetric bitten facet
function przEar(c, x, y, lean, k, chip, flat) {
  c.save();
  c.translate(x, y);
  c.rotate(lean + flat * 0.95);                // flattens back when aggressive
  const h = 13 * (1 - flat * 0.35);
  c.fillStyle = ramp(c, PRZ.body, -4, -h, 3, 2, Math.min(1, k * 1.15));
  c.beginPath();
  c.moveTo(-5, 2.5);                           // base buried in the skull
  if (chip) {                                  // chipped facet: a bitten apex
    c.quadraticCurveTo(-4, -h * 0.55, -1.8, -h);
    c.lineTo(0.9, -h * 0.6);                   // the notch
    c.lineTo(2.4, -h * 0.84);
  } else {
    c.quadraticCurveTo(-3.6, -h * 0.6, -0.8, -h);
  }
  c.quadraticCurveTo(2.8, -h * 0.42, 5, 3);    // concave inner slope down
  c.closePath(); c.fill();
  // inner-ear facet: violet
  c.fillStyle = ramp(c, PRZ.viol, -1, -h * 0.7, 2, 1, 0.85 * k);
  c.beginPath(); c.moveTo(-1.8, 1);
  c.quadraticCurveTo(-1.4, -h * 0.5, chip ? -0.7 : 0, -h * 0.78 + (chip ? h * 0.13 : 0));
  c.quadraticCurveTo(1.9, -h * 0.35, 3, 2);
  c.closePath(); c.fill();
  // lit outer edge, one short stroke
  c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = 0.4 * k;
  c.strokeStyle = PRZ.white.mid; c.lineWidth = 0.9;
  c.beginPath(); c.moveTo(-4.4, 1);
  c.quadraticCurveTo(-3.8, -h * 0.5, chip ? -1.8 : -0.8, -h * 0.96);
  c.stroke(); c.restore();
  c.restore();
}

// ---- the turntable: disc, engraved light lines, two arc coils ----
function przDisc(c, b, P, rot) {
  const t = b.anim;
  const RX = 34, RY = 8;
  // side wall (thickness)
  c.fillStyle = ramp(c, PRZ.body, -RX, -6, RX, 2, 0.8);
  c.beginPath();
  c.ellipse(0, -6, RX, RY, 0, 0, Math.PI);     // bottom half of top ellipse
  c.ellipse(0, -2, RX, RY, 0, Math.PI, 0, true);
  c.fill();
  c.fillStyle = PRZ.body.deep;
  c.beginPath(); c.ellipse(0, -2, RX, RY, 0, 0, Math.PI); c.fill();
  // top surface
  const tg = c.createLinearGradient(-RX, -14, RX, 0);
  tg.addColorStop(0, PRZ.body.mid); tg.addColorStop(0.55, PRZ.body.dark); tg.addColorStop(1, PRZ.body.deep);
  c.fillStyle = tg;
  c.beginPath(); c.ellipse(0, -6, RX, RY, 0, 0, 7); c.fill();
  // engraved rotating light lines: even segments riding the ellipse
  c.save(); c.globalCompositeOperation = 'lighter';
  const glow = Math.max(0.25, P.glow);
  for (let ring = 0; ring < 2; ring++) {
    const f = [0.52, 0.82][ring];
    const n = 6 + ring * 4;
    c.strokeStyle = PRZ.cyan.mid; c.lineWidth = ring === 1 ? 1.5 : 1.1;
    c.globalAlpha = 0.22 + 0.3 * glow;
    for (let i = 0; i < n; i++) {
      const a0 = rot * (1 + ring * 0.18) + i / n * Math.PI * 2;
      c.beginPath();
      c.ellipse(0, -6, RX * f, RY * f, 0, a0, a0 + 3.6 / n); c.stroke();
    }
  }
  // spindle light under the cat
  c.globalAlpha = 0.5 * glow;
  c.fillStyle = PRZ.cyan.mid;
  c.beginPath(); c.ellipse(0, -6, 2.5, 1, 0, 0, 7); c.fill();
  // front rim glow arc
  c.globalAlpha = 0.5 * glow;
  c.strokeStyle = PRZ.cyan.mid; c.lineWidth = 1.6;
  c.beginPath(); c.ellipse(0, -2, RX, RY, 0, 0.5, Math.PI - 0.5); c.stroke();
  c.restore();
  // spin blur rings (arcspin / arcstorm)
  if (P.rings > 0.02) {
    c.save(); c.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 3; i++) {
      c.globalAlpha = P.rings * (0.3 - i * 0.08) * (0.7 + Math.sin(t * 30 + i * 2) * 0.3);
      c.strokeStyle = i === 1 ? PRZ.white.mid : PRZ.cyan.mid;
      c.lineWidth = 2.5 - i * 0.6;
      c.beginPath(); c.ellipse(0, -6, RX + 3 + i * 5, RY + 1.5 + i * 2, 0, 0, 7); c.stroke();
    }
    c.restore();
  }
  // ---- the two arc coils, outboard on the disc, behind the cat ----
  for (const sx of [-1, 1]) {
    const bx = sx * (RX - 3), by = -5;
    c.save(); c.translate(bx, by);
    occl(c, 0, 1, 4, 2, 0.4);
    c.fillStyle = ramp(c, PRZ.body, -1.5, -10, 1.5, 0, 0.85);
    c.fillRect(-1.4, -10, 2.8, 10);
    for (let i = 0; i < 3; i++) {              // violet coil windings
      c.fillStyle = ramp(c, PRZ.viol, -3, -4 - i * 2.6, 3, -2.5 - i * 2.6, 0.7);
      c.beginPath(); c.ellipse(0, -3.6 - i * 2.6, 3, 1.3, 0, 0, 7); c.fill();
    }
    c.fillStyle = PRZ.white.dark;              // the emitter tip â€” quiet until it fires
    if (P.coil > 0.3) { c.shadowColor = PRZ.viol.mid; c.shadowBlur = 4 + P.coil * 7; c.fillStyle = PRZ.white.mid; }
    c.beginPath(); c.arc(0, -11.5, 1.5, 0, 7); c.fill();
    c.shadowBlur = 0;
    c.restore();
  }
  // coil sparks: idle crackle, storm arcs
  const sparky = P.coil > 0.3 || Math.sin(t * 6.7) > 0.92;
  if (sparky) {
    const a = Math.min(1, P.coil + 0.25);
    const tipY = -16.5, tipX = RX - 3;
    przBolt(c, -tipX, tipY, -tipX * 0.3, -34 - Math.sin(t * 9) * 5, Math.floor(t * 24), 3, a * 0.8);
    przBolt(c, tipX, tipY, tipX * 0.3, -33 + Math.cos(t * 8) * 5, Math.floor(t * 21) + 7, 3, a * 0.8);
    if (P.coil > 0.55)
      przBolt(c, -tipX, tipY, tipX, tipY, Math.floor(t * 19) + 3, 6, a * 0.6);
  }
}

// ---- death: the facets shatter into rainbow shards; the disc spins down ----
function przDeath(c, b, S) {
  const k = 1 - clamp((b.deathAnimT || 0) / 1.6, 0, 1);
  if (!b.przShards) {
    const sh = [];
    const V = PRZ_V;
    PRZ_F.forEach((f, i) => {
      const mx = (V[f[0]][0] + V[f[1]][0] + V[f[2]][0]) / 3;
      const my = (V[f[0]][1] + V[f[1]][1] + V[f[2]][1]) / 3;
      sh.push({ x: mx, y: my, vx: mx * 14 + rnd(-60, 60), vy: -rnd(60, 240),
        rot: rnd(0, 6), vr: rnd(-7, 7), s: rnd(3, 6.5), col: PRZ_SPEC[i % PRZ_SPEC.length] });
    });
    for (let i = 0; i < 6; i++)                // head / ear / tail fragments
      sh.push({ x: rnd(-38, -22), y: rnd(-48, -32), vx: rnd(-160, -20), vy: -rnd(80, 260),
        rot: rnd(0, 6), vr: rnd(-8, 8), s: rnd(2, 4.5), col: PRZ_SPEC[i % PRZ_SPEC.length] });
    b.przShards = sh;
  }
  // the disc stays, spinning down in a shower of sparks
  b.przRot = (b.przRot || 0) + 0.032 * (30 * (1 - k) * (1 - k) + 1.5);
  const P = { glow: Math.max(0.05, 0.8 - k), rings: Math.max(0, 0.5 - k), coil: Math.max(0, 0.6 - k * 1.2), crouch: 0 };
  przDisc(c, b, P, b.przRot);
  if (k < 0.85 && typeof addPart === 'function' && chance(0.5)) {
    const sx2 = b.cx ? b.cx() : 0, sy2 = b.y != null ? b.y + b.h : 0;
    addPart(sx2 + rnd(-30, 30) * S, sy2 - rnd(0, 6), rnd(-90, 90), rnd(-160, -30), 0.35, '#b48cff', 2, 300, true);
  }
  // the body flash-fades as the shards take over
  c.save(); c.globalCompositeOperation = 'lighter';
  c.globalAlpha = Math.max(0, 0.7 - k * 2.4);
  const fg = c.createRadialGradient(-4, -26, 2, -4, -26, 40);
  fg.addColorStop(0, 'rgba(255,255,255,0.9)'); fg.addColorStop(0.4, 'rgba(55,255,208,0.5)');
  fg.addColorStop(1, 'rgba(180,140,255,0)');
  c.fillStyle = fg; c.beginPath(); c.arc(-4, -26, 40, 0, 7); c.fill();
  c.restore();
  // rainbow shards, tumbling out and falling
  for (const s2 of b.przShards) {
    s2.x += s2.vx * 0.032; s2.y += (s2.vy + 640 * k) * 0.032;
    if (s2.y > -3) { s2.y = -3; s2.vy = -Math.abs(s2.vy) * 0.4; s2.vx *= 0.7; }
    s2.rot += s2.vr * 0.032;
    c.save();
    c.globalAlpha = Math.max(0, 1 - k * 1.05);
    c.translate(s2.x, s2.y); c.rotate(s2.rot);
    c.fillStyle = s2.col;
    c.shadowColor = s2.col; c.shadowBlur = 6;
    c.beginPath(); c.moveTo(-s2.s * 0.6, s2.s * 0.5); c.lineTo(s2.s * 0.7, s2.s * 0.3);
    c.lineTo(0, -s2.s * 0.8); c.closePath(); c.fill();
    c.shadowBlur = 0;
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha *= 0.7;
    c.strokeStyle = '#ffffff'; c.lineWidth = 0.7;
    c.beginPath(); c.moveTo(-s2.s * 0.5, s2.s * 0.4); c.lineTo(0, -s2.s * 0.7); c.stroke();
    c.restore();
  }
}

// ===========================================================================
// entry point â€” bottom-anchored at the boss hitbox, THE TURN LAW tier 3+:
// the cat turns by riding its disc through the crossing (flex floor 0.85)
// while the disc itself visibly spins with the turn and sparks at centre.
// ===========================================================================
function drawPrism(c, b) {
  try {
    // authored art first; the procedural cat stays as the fallback so the boss
    // is never missing while the sheet is still coming down the wire
    if (drawPrismSheet(c, b)) return true;
    const S = (b.h * 1.15) / 34;
    const cx = b.x + b.w / 2, footY = b.y + b.h;
    const fv = b.faceVis == null ? (b.face || 1) : b.faceVis;
    const ta = Math.max(0.001, Math.abs(fv));
    const sgn = fv < 0 ? 1 : -1;               // authored nose-LEFT

    // disc rotation: a real turntable â€” it idles slowly, whips with facing
    // changes, and screams during the arc states
    const P = (b.dead && !b.purified) ? null : przPose(b);
    const dA = b.anim - (b.przAt == null ? b.anim : b.przAt); b.przAt = b.anim;
    if (!b.dead || b.purified) {
      const dFv = fv - (b.przFv == null ? fv : b.przFv);
      b.przRot = (b.przRot || 0) + dA * P.discSpin + dFv * -2.2;
      // the crossing frame: the disc kicks sparks as the cat swings through
      if (b.przFv != null && Math.sign(fv) !== Math.sign(b.przFv) && typeof addPart === 'function') {
        for (let i = 0; i < 7; i++)
          addPart(cx + rnd(-b.w * 0.45, b.w * 0.45), footY - rnd(2, 8),
            rnd(-130, 130), rnd(-150, -40), 0.3, i % 2 ? '#37ffd0' : '#e0e0ff', 2.5, 260, true);
      }
      b.przFv = fv;
    }

    c.save();
    c.translate(cx, footY);
    c.scale(S, S);

    if (b.dead && !b.purified) { przDeath(c, b, S); c.restore(); return true; }

    // the turntable does not mirror â€” it is a disc; only its lines rotate
    przDisc(c, b, P, b.przRot || 0);

    // the cat, mirrored through the turn with the tier-3 floor (>= 0.85)
    c.save();
    c.translate(0, (1 - ta) * 2.5 + P.crouch + P.bob * 0.4);
    c.scale(sgn * (0.85 + 0.15 * ta) * P.stretchX, P.stretchY * (1 - (1 - ta) * 0.04));
    if (P.sit) {                               // weight shift: rear settles, chest rises
      c.translate(20, -15); c.rotate(0.17 * P.sit); c.translate(-20, 15 + 3 * P.sit);
    }
    c.rotate(P.pitch);
    if (P.spin) {                              // dashslash: the light-blade spin
      // directional smear first, in unspun space: the rainbow it drags behind
      c.save(); c.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 4; i++) {
        c.globalAlpha = 0.22 - i * 0.04;
        c.strokeStyle = PRZ_SPEC[(i * 2 + 1) % PRZ_SPEC.length]; c.lineWidth = 2.2;
        c.beginPath(); c.moveTo(18 + i * 9, -14 - i * 5);
        c.lineTo(50 + i * 12, -14 - i * 5); c.stroke();
      }
      c.restore();
      c.translate(-3, -25); c.rotate(P.spin); c.translate(3, 25);
      // rotational blur streaks + the rainbow the spin smears out
      c.save(); c.globalCompositeOperation = 'lighter';
      const sk = Math.min(1, P.spin / 2);
      for (let i = 0; i < 5; i++) {
        const a0 = -P.spin * 1.3 - i * 0.45;
        c.globalAlpha = Math.max(0, 0.42 * sk - i * 0.06);
        c.strokeStyle = i === 0 ? '#ffffff' : PRZ_SPEC[(i * 2) % PRZ_SPEC.length];
        c.lineWidth = 3 - i * 0.4;
        c.beginPath(); c.arc(-3, -25, 26 + i * 4, a0, a0 + 1.5); c.stroke();
      }
      c.restore();
    }
    if (P.pant) {                              // panting vibration
      c.translate(0, Math.sin(b.anim * 16) * 0.6);
    }
    przBody(c, b, P, fv);
    c.restore();

    c.restore();
    return true;
  } catch (e) { try { c.restore(); } catch (e2) {} return false; }
}

// CLAWBYTE â€” elements, boss suits and the Song.
// The full design rationale lives in BESTIARY.md; this file is only the rules.
//
// Mega Man X's loop: every boss drops a suit, every suit carries one arm, and
// every arm devastates exactly one other boss. Nothing is locked behind a suit â€”
// you may fight any boss at any time. The right suit just turns a wall into a door.

const ELEM = {
  skarn: { col: '#c87a3c', glow: '#ffb069' },
  vann:  { col: '#3fb8e0', glow: '#8ce4ff' },
  hott:  { col: '#ff7a34', glow: '#ffc077' },
  glazz: { col: '#a8e4f4', glow: '#e6fbff' },
  zizt:  { col: '#b48cff', glow: '#dcc6ff' },
  vizrr: { col: '#ff4d4d', glow: '#ff9a9a' },   // only the infected glow red
  murr:  { col: '#37ffd0', glow: '#c6fff0' },   // the Song â€” no enemy carries it
};

// attacker -> the one element it devastates. A closed ring of five, plus the
// canon entry: cold is the one thing the broadcast cannot cross (STORY.md).
const BEATS = { zizt: 'vann', vann: 'hott', hott: 'glazz', glazz: 'skarn', skarn: 'zizt' };
const EXTRA_BEATS = { glazz: ['skarn', 'vizrr'] };

const BOSS_EL = { glitch: 'skarn', brood: 'vann', atlas: 'hott', zero: 'glazz', prism: 'zizt', mother: 'vizrr' };
// the five mimic frames, typed by the job each was built to do
const MIMIC_EL = {
  crawler: 'skarn',   // a hauler that read the word "hound" and did its best
  hopper:  'vann',    // a leak-seeker; it copied HZD-99's own frame
  blob:    'hott',    // foundry spillage that cooled into legs
  flier:   'zizt',    // a survey lens that hovers and discharges
  turret:  'zizt',    // a fixed emplacement running on the same arc supply
  surge:   'zizt',    // a line breaker venting the same arc supply down its rail
  kiln:    'hott',    // a casting vent still breathing the crucible's heat
  rime:    'glazz',   // an archive condenser still holding the stacks at zero
  snare:   'vizrr',   // a nest polyp running on the broadcast itself â€” the
                      // first minion to glow with the infection's own red
};

// suits, in the order they are offered on the wheel
const ARMS = [
  { id: 'shard',   el: 'skarn', from: 'glitch', cost: 8,  cd: 0.30 },
  { id: 'jet',     el: 'vann',  from: 'brood',  cost: 6,  cd: 0.16 },
  { id: 'slag',    el: 'hott',  from: 'atlas',  cost: 12, cd: 0.52 },
  { id: 'frost',   el: 'glazz', from: 'zero',   cost: 14, cd: 0.60 },
  { id: 'arc',     el: 'zizt',  from: 'prism',  cost: 10, cd: 0.42 },
];
const ARM_BY_BOSS = {}; for (const a of ARMS) ARM_BY_BOSS[a.from] = a.id;
function armDef(id) { return ARMS.find(a => a.id === id); }

// ---------------------------------------------------------------------------
// THE PLATING CHAIN. Every boss past the first is armored, and its plating
// shorts only to the arm taken from the boss before it â€” beat NULLFANG, wear
// its arm against TALONHOST, and so on up the chain. While plated, hits do a
// fraction; short the plating (or catch a vulnerable window: the Song's
// stagger, TALONHOST's rest) and it takes damage for real. Each boss is also
// natively faster and more relentless than the one before.
// ---------------------------------------------------------------------------
const BOSS_GATE = { brood: 'shard', atlas: 'jet', zero: 'slag', prism: 'frost', mother: 'arc' };
const BOSS_AGGRO = { glitch: 1, brood: 1.12, atlas: 1.22, zero: 1.32, prism: 1.42, mother: 1.55 };
function bossGateOpen(b) {
  if (!BOSS_GATE[b.kind]) return true;
  if ((b.shieldT || 0) > 0) return true;
  if ((b.stagT || 0) > 0) return true;                       // the Song opens all
  if (b.kind === 'brood' && (b.st === 'restlow' || b.st === 'rest')) return true;
  // the hit-group break is OPEN, whatever arm she is wearing: a window that
  // still clinks at 40% is a pause, not a reward for pressing the advantage
  if (b.st === 'daze') return true;
  return false;
}

function ownedArms() { return ARMS.filter(a => ((G.save && G.save.arms) || []).includes(a.id)); }
// slot 0 is deliberately empty: the plain bolt stays on the wheel, so acquiring a
// suit never takes an option away from you.
function armSlots() { return [null].concat(ownedArms()); }
function activeArm() {
  const sl = armSlots();
  return sl[((G.save && G.save.armIdx) || 0) % sl.length] || null;
}
function cycleArm(dir) {
  const sl = armSlots(); if (sl.length < 2) return false;
  G.save.armIdx = ((((G.save.armIdx || 0) + (dir || 1)) % sl.length) + sl.length) % sl.length;
  return true;
}
function armEl() { const a = activeArm(); return a ? a.el : null; }

// each suit fires differently â€” that is the point of wearing it
function fireArm(p, a) {
  const x = p.x + p.w / 2 + p.face * 16, y = p.y + p.h / 2 - 4;
  const E = ELEM[a.el], base = DF().pdmg;
  const mk = (vx, vy, dmg, r, grav, life) => {
    const pr = new Proj(x, y, vx, vy, true, Math.round(dmg * base), r, E.col, grav || 0, life || 3);
    pr.el = a.el; G.projs.push(pr); return pr;
  };
  if (a.id === 'shard') {                       // wide cone of ferrous shrapnel
    for (let i = -2; i <= 2; i++) mk(p.face * (430 + Math.abs(i) * 30), i * 105, 11, 5, 260, 0.5);
    sfx('shoot');
  } else if (a.id === 'jet') {                  // continuous shove
    mk(p.face * (520 + rnd(-40, 40)), rnd(-40, 40), 6, 7, 0, 0.32);
    sfx('shoot');
  } else if (a.id === 'slag') {                 // lobbed, and it pools where it lands
    const pr = mk(p.face * 380, -240, 26, 10, 900, 2.2);
    pr.pool = true; sfx('cast');
  } else if (a.id === 'frost') {                // freezes what it touches solid
    const pr = mk(p.face * 470, 0, 20, 9, 0, 1.4);
    pr.freeze = true; sfx('cast');
  } else {                                      // arc: chains to a second target
    const pr = mk(p.face * 660, 0, 17, 8, 0, 1.1);
    pr.chain = 2; sfx('cast');
  }
}

// element carried by any target
function elOf(e) {
  if (!e) return null;
  if (typeof Boss !== 'undefined' && e instanceof Boss) return BOSS_EL[e.kind] || 'skarn';
  return MIMIC_EL[e.kind] || 'skarn';
}
// how hard `atk` lands on `def`
function elemMul(atk, def) {
  if (!atk || !def) return 1;
  const wins = EXTRA_BEATS[atk] || (BEATS[atk] ? [BEATS[atk]] : []);
  if (wins.includes(def)) return 2.6;
  if (atk === def) return 0.5;
  return 1;
}

// One damage funnel so melee, arms and the Song all obey the chart and all
// produce the same read on screen.
// ---------------------------------------------------------------------------
// THE BODY YOU SEE IS THE BODY YOU CAN HIT. The new boss art draws far beyond
// the old movement boxes, so player attacks test against a visual-sized
// hurtbox. Movement and contact damage keep the tight box â€” the fight gets
// fairer for the player, never harsher.
// ---------------------------------------------------------------------------
// HOW CLOSE SHE MUST STAND TO FREE A BOUND MACHINE (owner, 2026-11-15: "it's
// unclear to me how to free the crawlers. It should be by pressing E, I think,
// but it did not prompt it"). It was 46 px from the centre of the collision
// box, whatever the machine â€” and the pack is drawn nearly twice the width of
// its box, so a player who walked up to a bound wolf and stopped at the body
// she could SEE was outside it, with no prompt and a key that did nothing.
// The reach is the drawn body's half-width and a step more.
// (the body as MEASURED off its art â€” assets/bodybox.json, the same table the
// solid wall round a live one is built from â€” and the hurt box where a kind
// has no measurement)
function rescueReach(e) {
  const hb = hurtBoxOf(e);
  const T = (typeof window !== 'undefined' && window.BODY_BOX && !(typeof isHero === 'function' && isHero())) ? window.BODY_BOX[e.kind] : null;
  const drawn = T && T.w === e.w ? Math.max(T.l || 0, T.r || 0) : 0;
  return Math.min(120, Math.max(46, hb.w / 2 + 30, drawn + 22));
}
function hurtBoxOf(e) {
  const cx2 = e.x + e.w / 2;
  if (e.kind === 'glitch') {            // NULLFANG: long low body, bottom-anchored
    const w = e.w * 2.6, h = e.h * 2.1;
    return { x: cx2 - w / 2, y: e.y + e.h - h, w, h };
  }
  if (e.kind === 'brood') {             // TALONHOST: wings and tail, centred
    const w = e.w * 2.4, h = e.h * 2.2;
    return { x: cx2 - w / 2, y: e.y + e.h / 2 - h / 2, w, h };
  }
  if (e.kind === 'flier') {             // mini TALONHOST wingspan
    const w = e.w * 2.0, h = e.h * 1.7;
    return { x: cx2 - w / 2, y: e.y + e.h / 2 - h / 2, w, h };
  }
  if (e.kind === 'horn' && typeof ghHurtBox === 'function') return ghHurtBox(e);   // GRAVEHORN: barrel, head and horns
  if (e.kind === 'zero') {              // GLACIERE: the drawn unicorn, horn to tail
    const w = e.w * 1.5, h = e.h * 1.9;
    return { x: cx2 - w / 2, y: e.y + e.h - h, w, h };
  }
  if (typeof G !== 'undefined' && G.roomDef && G.roomDef.zone === 'A'
      && (e.kind === 'crawler' || e.kind === 'hopper')) {
    const w = e.w * 1.8, h = e.h * 1.45; // the pack is drawn bigger than its box
    return { x: cx2 - w / 2, y: e.y + e.h - h, w, h };
  }
  return e;
}

// How long a hit stays "recent" for the purposes of grouping, and what the
// window is worth once it opens. 1.1 s is a little over three swings of a
// three-hit combo at her cadence, so a committed player groups without having
// to frame-count, and a player poking from range never does.
const DAZE_WINDOW = 1.1, DAZE_MUL = 1.6;

function dealDmg(e, dm, atkEl, x, y, noPenalty, move) {
  if (typeof combatProtected === 'function' && combatProtected(e)) return 0;
  if (!Number.isFinite(dm) || dm <= 0) return 0;
  const raw = dm, hpBefore = e.hp;
  if (typeof combatDamage === 'function') dm = combatDamage(dm, combatDefense(e));
  if (typeof storyProtected === 'function' && storyProtected(e)) return 0;
  // THE SAGE IS NEVER KILLED. Every strike on one routes through its own
  // law (js/entities.js sageStruck): claws break it down to the floor and
  // no further; the crystal purifies. docs/combat/SAGE.md.
  if (e.kind === 'sage' && typeof sageStruck === 'function') {
    const accepted = sageStruck(e, dm, x, y), lost = Math.max(0, hpBefore - e.hp);
    if (typeof combatLog === 'function') combatLog(e, raw, lost, move, accepted > 0 ? 'hit' : 'purification-or-lock');
    if (lost > 0 && typeof combatImpact === 'function') combatImpact(e, x, y, move);
    return accepted > 0 ? lost : 0;
  }
  // NEVER PUNISH AFFECTION â€” and never let a mis-swing undo an hour of the run.
  // A wolf that has changed sides cannot be hurt by her, at all: the swing
  // lands as a hand on a flank instead (js/pets.js has the same law for the
  // freed guardians). Without this, the reward for taming the Alpha would be a
  // roomful of friends the player can accidentally delete.
  if (typeof isWolf === 'function' && isWolf(e) && typeof packTamed === 'function' && packTamed()) {
    burst(x, y, 5, '#9ffcff', 150, 0.3, 0, 2, true);
    if (typeof sfx === 'function') sfx('pick');
    return 0;
  }
  // THE GUARD'S PLATE. Up by default, down only while it is winded from its
  // own lunge â€” so the answer is not "hit it more", it is "hit it THEN".
  // Deliberately not immunity: a player who keeps swinging still makes very
  // slow progress and is never hard-stuck, they are simply being taught that
  // there is a better moment.
  // ...AND THE PLATE IS ON ONE SIDE OF IT. It used to deny from everywhere â€”
  // the owner: "the small one with the shield is practically invincible. I've
  // been hitting it so many times from up, below, left and right" â€” because
  // this branch never asked WHERE the hit came from, while the plate is drawn
  // on the machine's `dir` side and nowhere else. A picture of a shield on the
  // left that stops a blow from the right is a lie, and it turned "wait for the
  // window" into "there is no answer". Now the plate stops what it covers: a
  // hit from the front, at body height. From BEHIND (jump over it â€” it takes a
  // beat to turn) or from ABOVE (the air attack, the plunge) the metal is not
  // there and the blow lands whole. Three answers where there was one.
  if (e.guard) {
    const ecx = e.x + e.w / 2, dir = e.dir || 1;
    const fromFront = (Math.sign(x - ecx) || dir) === dir;
    const fromAbove = y < e.y + e.h * 0.3;
    if (fromFront && !fromAbove) {
      burst(x, y, 7, '#cfe0f0', 190, 0.3, 60, 2.2, true);
      if (typeof sfx === 'function') sfx('bosshit');
      e.hurtT = 0.12;
      e.hp -= Math.max(1, Math.round(dm * 0.12));
      if (typeof combatLog === 'function') combatLog(e, raw, Math.min(hpBefore, hpBefore - e.hp), move, 'shield-chip');
      if (e.hp <= 0 && !e.dead) e.die(Math.sign(x - ecx) || 1, -0.3);
      return 0;
    }
  }
  // A GUARDIAN'S HIDE (opt-in: the boss's own step keeps `hideK` current).
  // 1 in its openings, a fraction while it is winding up or striking â€” a blow
  // thrown INTO an attack lands, but turned â€” and 0 for the instant it is
  // springing clear. It says so: pale grit off the plate instead of the hit's
  // own gold, so a player can see which of her blows were worth throwing.
  if (e.hideK != null && e.hideK < 1 && e.st !== 'daze' && !e.dead) {
    if (e.hideK <= 0) { burst(x, y, 4, '#cfe0f0', 150, 0.2, 0, 2, true); return 0; }
    dm = Math.max(1, Math.round(dm * e.hideK));
    burst(x, y, 7, '#cfe0f0', 210, 0.26, 120, 2.2, true);
    e.turnedT = 0.25;
  }
  // ARC OVERLOAD: hiding inside the lightning â€” nothing lands until it ends
  if ((e.stormT || 0) > 0) {
    burst(x, y, 6, '#8ff6ff', 200, 0.3, 0, 2.5, true);
    G.elemPop = { t: 0.4, x, y, el: null };
    return 0;
  }
  // plating chain: the key element SHORTS the shield; anything else clinks
  if (BOSS_GATE[e.kind] && e.hpMax) {
    const key = armDef(BOSS_GATE[e.kind]);
    if (atkEl && key && atkEl === key.el && (e.shieldT || 0) <= 0) {
      e.shieldT = 6;
      burst(x, y, 26, ELEM[atkEl].glow, 380, 0.6, 120, 4, true);
      cam.shake = Math.max(cam.shake, 8); G.hitStop = Math.max(G.hitStop, 0.1);
      sfx('phase');
    } else if (!bossGateOpen(e)) {
      // WRONG ARM USED TO MEAN 6.7x THE FIGHT. The design promises you may take
      // the guardians in any order; this line then punished exactly that. The
      // finale is gated behind an arm that drops from an OPTIONAL secret boss,
      // so a player who never found it fought 750 HP at 7.3 damage a second â€”
      // a hundred and three seconds of unbroken contact. It is still a strong
      // reason to go and find the counter; it is no longer a wall in front of
      // somebody who did not know there was one.
      dm = Math.max(1, Math.round(dm * 0.40));
      G.elemPop = { t: 0.4, x, y, el: null };
    }
  }
  const def = elOf(e);
  let mul = elemMul(atkEl, def);
  if (noPenalty && mul < 1) mul = 1;   // the blade never gets worse for the suit worn
  if (e.hypnoT > 0) mul *= 1.5;            // charmed things do not brace
  // ---------------------------------------------------------------------
  // THE HIT GROUP. A guardian that only ever loses HP gives the player no
  // reason to press an advantage â€” every hit is worth the same, so trading
  // one at a time from max range is optimal play and the fight goes quiet.
  //
  // So a run of hits landed CLOSE TOGETHER breaks it: the counter is on a
  // rolling window, and it only counts because the window has not lapsed.
  // Opting in is per-boss (`dazeAt`), the state change is REQUESTED here and
  // taken by the boss's own update â€” damage code must not reach into a state
  // machine, or the boss can be yanked out of a committed move mid-frame.
  if (e.dazeAt && !e.dead && (e.dazeCD || 0) <= 0 && e.st !== 'daze') {
    e.dazeHits = ((e.dazeWin || 0) > 0 ? (e.dazeHits || 0) : 0) + 1;
    // a guardian's own span when it has one (BSTAT.dazeSpan): the fliers are
    // only in reach during their recoveries, so their group is two punishes
    e.dazeWin = e.dazeSpan || DAZE_WINDOW;
    if (e.dazeHits >= e.dazeAt) { e.dazeReq = true; e.dazeHits = 0; }
  }
  // and while it IS broken open, hits land harder â€” the window has to be worth
  // taking, or it is just a pause in the fight
  if (e.st === 'daze') mul *= DAZE_MUL;
  const out = Math.max(1, Math.round(dm * mul));
  e.hp -= out; e.hurtT = 0.15;
  if (typeof combatLog === 'function') combatLog(e, raw, Math.min(hpBefore, out), move);
  if (typeof combatImpact === 'function') combatImpact(e, x, y, move);
  // a body that answers being struck with something of its own (the yard
  // winch knocks scrap out of its housing: js/winch.js onStruck)
  if (typeof e.onStruck === 'function') e.onStruck(out, x, y);
  if (mul >= 2) {
    e.stagT = Math.max(e.stagT || 0, 0.32);
    burst(x, y, 16, ELEM[atkEl] ? ELEM[atkEl].glow : '#ffffff', 360, 0.45, 120, 4, true);
    cam.shake = Math.max(cam.shake, 6);
    G.hitStop = Math.max(G.hitStop, 0.07);
    G.elemPop = { t: 0.5, x, y, el: atkEl };
    sfx('bosshit');
  } else if (mul < 1) {
    G.elemPop = { t: 0.4, x, y, el: null };
  }
  return out;
}

// ---------------------------------------------------------------------------
// The Song. HZD-99 is a repair unit, so her signature is a diagnostic tool: the
// fabricators were tuned by tone, and mimics have no idea what music is.
// Costs volts, exactly as RUSTSONG.md specified:
//   "Nikk, volk klin gavt, murr gross takk." â€” give a little energy, take back
//   great music.
// ---------------------------------------------------------------------------
const SONG_COST = 26, SONG_RANGE = 210, SONG_HOLD = 3.0;

function playSong() {
  const px = player.x + player.w / 2, py = player.y + player.h / 2;
  player.volts -= SONG_COST;
  player.songT = 0.55;
  G.songWave = { t: 0.7, x: px, y: py };
  sfx('powerUp');
  let charmed = 0;
  // the Husk listens too â€” calming it is how you get your charge back
  const targets = G.enemies
    .concat(G.pickups.filter(o => o && o.kind === 'husk'))
    .concat(G.boss && !G.boss.dead && G.boss.st !== 'intro' && G.boss.st !== 'dorm' ? [G.boss] : []);
  for (const e of targets) {
    if (e.dead || e.disabled || e.rescued) continue;
    if (Math.hypot(e.x + e.w / 2 - px, e.y + e.h / 2 - py) > SONG_RANGE) continue;
    if (typeof Boss !== 'undefined' && e instanceof Boss) {
      e.stagT = Math.max(e.stagT || 0, 0.85);   // too large to charm â€” but it can miss
      e.t = Math.max(e.t, 0.9);
      G.elemPop = { t: 0.5, x: e.cx(), y: e.y - 10, el: 'murr' };
    } else {
      e.hypnoT = SONG_HOLD; e.vx = 0; charmed++;
      burst(e.x + e.w / 2, e.y, 8, ELEM.murr.glow, 150, 0.5, -40, 3, true);
    }
  }
  return charmed;
}

// ---------------------------------------------------------------------------
// Graphics. Each suit gets a badge built the same way as the portraits: a lit
// form with a hue-shifted ramp, never a flat primitive.
// ---------------------------------------------------------------------------
function drawArmBadge(c, id, r, lit) {
  const a = armDef(id); if (!a) return;
  const E = ELEM[a.el];
  c.save();
  // socket
  const g = c.createLinearGradient(-r, -r, r * 0.7, r);
  g.addColorStop(0, lit ? '#2b4a5c' : '#16232e'); g.addColorStop(1, '#0a1420');
  c.fillStyle = g;
  c.beginPath();
  for (let i = 0; i < 6; i++) {                 // hex bezel: reads as machined
    const an = i / 6 * Math.PI * 2 - Math.PI / 2;
    c[i ? 'lineTo' : 'moveTo'](Math.cos(an) * r, Math.sin(an) * r);
  }
  c.closePath(); c.fill();
  // THE BEZEL SAYS "ARM", THE FILL SAYS WHICH ONE. The rim is the loadout's
  // arm hue (js/loadout.js) on every badge, worn or not â€” the system reads at
  // a glance; the element keeps the glyph inside, so the suit still does too.
  // An unworn badge is the same rim, dashed and thinner.
  const AC = typeof LOADOUT_COL !== 'undefined' ? LOADOUT_COL.arm : E.glow;
  c.strokeStyle = AC;
  c.lineWidth = lit ? Math.max(2.2, r * 0.15) : 1.6;
  if (!lit) c.setLineDash([r * 0.42, r * 0.22]);
  c.stroke(); c.setLineDash([]);

  c.save(); c.scale(r / 16, r / 16);
  c.fillStyle = E.col;
  if (lit) { c.shadowColor = E.glow; c.shadowBlur = 10; }
  if (a.el === 'skarn') {              // shrapnel: three angular shards
    for (const [dx, dy, s] of [[-5, 2, 1], [3, -4, 0.8], [5, 5, 0.6]]) {
      c.beginPath(); c.moveTo(dx, dy - 6 * s); c.lineTo(dx + 5 * s, dy + 3 * s);
      c.lineTo(dx - 4 * s, dy + 4 * s); c.closePath(); c.fill();
    }
  } else if (a.el === 'vann') {        // droplet under pressure
    c.beginPath(); c.moveTo(0, -9); c.quadraticCurveTo(7, 0, 7, 4);
    c.quadraticCurveTo(7, 10, 0, 10); c.quadraticCurveTo(-7, 10, -7, 4);
    c.quadraticCurveTo(-7, 0, 0, -9); c.closePath(); c.fill();
  } else if (a.el === 'hott') {        // slag: a flame with a heavy base
    c.beginPath(); c.moveTo(0, -10); c.quadraticCurveTo(6, -2, 5, 3);
    c.quadraticCurveTo(9, 1, 8, 7); c.quadraticCurveTo(4, 11, 0, 11);
    c.quadraticCurveTo(-8, 11, -8, 4); c.quadraticCurveTo(-8, -2, 0, -10);
    c.closePath(); c.fill();
  } else if (a.el === 'glazz') {       // frost lattice: six spokes, barbed
    c.strokeStyle = E.col; c.lineWidth = 2; c.lineCap = 'round';
    for (let i = 0; i < 6; i++) {
      const an = i / 6 * Math.PI * 2;
      c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(an) * 9, Math.sin(an) * 9); c.stroke();
      c.beginPath();
      c.moveTo(Math.cos(an) * 5, Math.sin(an) * 5);
      c.lineTo(Math.cos(an + 0.7) * 8, Math.sin(an + 0.7) * 8); c.stroke();
    }
  } else {                             // arc: a chaining bolt
    c.beginPath(); c.moveTo(2, -10); c.lineTo(-6, 1); c.lineTo(-1, 1);
    c.lineTo(-3, 10); c.lineTo(6, -2); c.lineTo(1, -2); c.closePath(); c.fill();
  }
  c.shadowBlur = 0; c.restore();
  c.restore();
}

// the keytar HZD-99 carries â€” drawn in the player's local space while playing
function drawKeytar(c, face, t) {
  c.save(); c.scale(face, 1);
  c.fillStyle = '#1b2b36';
  c.beginPath(); c.moveTo(-2, -4); c.lineTo(20, -8); c.lineTo(21, 0); c.lineTo(-1, 3); c.closePath(); c.fill();
  c.strokeStyle = 'rgba(190,235,230,0.5)'; c.lineWidth = 1; c.stroke();
  for (let i = 0; i < 7; i++) {                    // keys, one lighting per beat
    const on = (Math.floor(t * 14) % 7) === i;
    c.fillStyle = on ? ELEM.murr.glow : '#cfe0e4';
    c.fillRect(0.5 + i * 2.8, -6.6 + i * 0.25, 2.1, 4.4);
  }
  c.restore();
}


// ---------------------------------------------------------------------------
// SHURIKEN â€” zizt-charged throwing stars. A ninja without stars is not a ninja.
//
// The restock loop is a repair unit's, not a soldier's: she does not find ammo,
// she gets her own back. A thrown star sticks where it lands and can be picked up
// again, so the stars are a resource you manage in space rather than a magazine
// you refill. Killing something with one returns it instantly â€” a clean kill
// costs nothing. Benches re-forge the full set.
// ---------------------------------------------------------------------------
const STAR_MAX_BASE = 6, STAR_CD = 0.17, STAR_SPD = 720;
// the suit condenses ambient static back into a star while you fight on
const STAR_REGEN_T = 8;

function starMax() { return STAR_MAX_BASE + (((G.save && G.save.arms) || []).length >= 3 ? 2 : 0); }
function starCount() { return G.save ? (G.save.stars == null ? starMax() : G.save.stars) : 0; }
function starSet(n) { if (G.save) G.save.stars = clamp(n, 0, starMax()); }
function starRestock() { starSet(starMax()); }

function throwStar(p) {
  if (starCount() <= 0) { sfx('lowDown'); G.toast(t('star_none')); return false; }
  starSet(starCount() - 1);
  const up = inD('UP'), dn = inD('DOWN') && !p.on;
  const vy = up ? -STAR_SPD : dn ? STAR_SPD : 0;
  const vx = (up || dn) ? p.face * 90 : p.face * STAR_SPD;
  G.projs.push(new Star(p.x + p.w / 2 + p.face * 12, p.y + p.h / 2 - 4, vx, vy));
  p.starCD = STAR_CD; sfx('shoot');
  return true;
}

class Star {
  constructor(x, y, vx, vy) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.r = 7; this.w = 14; this.h = 14;
    this.spin = 0; this.life = 4; this.dead = false;
    this.stuck = false; this.stuckT = 0; this.hits = 0;
    this.el = 'zizt'; this.dmg = Math.round(15 * DF().pdmg);
    this.friendly = true;
    this.color = ELEM.zizt.col;   // drawLights() reads .color off every projectile
  }
  box() { return { x: this.x - 7, y: this.y - 7, w: 14, h: 14 }; }
  update(dt) {
    this.spin += dt * (this.stuck ? 1.2 : 26);
    if (this.stuck) {
      // sitting in a wall, waiting to be collected
      this.stuckT += dt;
      if (!player.dead && aabb(this.box(), player)) {
        this.dead = true; starSet(starCount() + 1);
        sfx('pick'); burst(this.x, this.y, 8, MAT.cyan.lit, 160, 0.35, 0, 3, true);
      }
      if (this.stuckT > 26) { this.dead = true; }   // eventually it corrodes
      return;
    }
    this.life -= dt;
    if (this.life <= 0) { this.dropAsPickup(); return; }
    this.vy += 320 * dt;                            // a little drop, so it arcs
    this.x += this.vx * dt; this.y += this.vy * dt;
    if (solidAt(Math.floor(this.x / TILE), Math.floor(this.y / TILE))) {
      this.stuck = true; this.vx = this.vy = 0;
      sfx('metal'); burst(this.x, this.y, 5, MAT.cyan.mid, 120, 0.25, 0, 2, true);
      return;
    }
    const targets = G.enemies.concat(G.boss && !G.boss.dead && G.boss.st !== 'intro' && G.boss.st !== 'dorm' ? [G.boss] : []);
    for (const e of targets) {
      if (e.dead || e.disabled || e.rescued || (this.seen && this.seen.has(e))) continue;
      if (!aabb(this.box(), hurtBoxOf(e))) continue;
      if (!this.seen) this.seen = new Set();
      this.seen.add(e);
      dealDmg(e, this.dmg, 'zizt', this.x, this.y);
      burst(this.x, this.y, 9, ELEM.zizt.glow, 220, 0.3, 0, 3, true);
      if (e.hp <= 0) {
        e.die(Math.sign(this.vx) || 1, -0.3);
        // a clean kill hands the star straight back
        this.dead = true; starSet(starCount() + 1);
        sfx('pick');
        return;
      }
      this.hits++;
      if (this.hits >= 2) { this.dropAsPickup(); return; }   // pierces two, then falls
      this.vx *= 0.75;
    }
  }
  dropAsPickup() {
    this.dead = true;
    G.pickups.push(new StarPickup(this.x, this.y));
  }
  draw(c) {
    c.save(); c.translate(this.x, this.y); c.rotate(this.spin);
    if (!this.stuck) {                               // charge trail
      c.strokeStyle = 'rgba(63,216,238,0.35)'; c.lineWidth = 3;
      c.beginPath(); c.arc(0, 0, 10, 0, 7); c.stroke();
    }
    c.shadowColor = ELEM.zizt.col; c.shadowBlur = this.stuck ? 6 : 12;
    c.fillStyle = ramp(c, MAT.steel, -7, -7, 7, 7);
    c.beginPath();
    for (let i = 0; i < 4; i++) {                    // four-point star, notched
      const a = i / 4 * Math.PI * 2;
      c.lineTo(Math.cos(a) * 7.5, Math.sin(a) * 7.5);
      c.lineTo(Math.cos(a + 0.39) * 2.6, Math.sin(a + 0.39) * 2.6);
    }
    c.closePath(); c.fill();
    c.fillStyle = ELEM.zizt.glow;
    c.beginPath(); c.arc(0, 0, 1.9, 0, 7); c.fill();
    c.shadowBlur = 0; c.restore();
  }
}

// a star lying on the ground, waiting to be walked over
class StarPickup {
  constructor(x, y) {
    this.x = x - 7; this.y = y - 7; this.w = 14; this.h = 14;
    this.vx = rnd(-40, 40); this.vy = -90; this.t = 0; this.dead = false;
  }
  update(dt) {
    this.t += dt; this.vy += 900 * dt;
    const col = moveEnt(this, dt);
    if (col.d) { this.vy = 0; this.vx *= 0.8; }
    if (this.t > 1.0 && !player.dead && dist2(this.x, this.y, player.x, player.y) < 300 * 300) {
      const dx = player.x + 12 - this.x, dy = player.y + 18 - this.y, d = Math.hypot(dx, dy) || 1;
      this.x += dx / d * 280 * dt; this.y += dy / d * 280 * dt;   // never unreachable
    }
    if (!player.dead && aabb(this, player)) {
      this.dead = true; starSet(starCount() + 1);
      sfx('pick'); burst(this.x + 7, this.y + 7, 8, MAT.cyan.lit, 160, 0.35, 0, 3, true);
    }
  }
  draw(c) {
    c.save(); c.translate(this.x + 7, this.y + 7); c.rotate(this.t * 1.6);
    c.shadowColor = ELEM.zizt.col; c.shadowBlur = 8 + Math.sin(this.t * 5) * 4;
    c.fillStyle = MAT.steel.mid;
    c.beginPath();
    for (let i = 0; i < 4; i++) {
      const a = i / 4 * Math.PI * 2;
      c.lineTo(Math.cos(a) * 7, Math.sin(a) * 7);
      c.lineTo(Math.cos(a + 0.39) * 2.4, Math.sin(a + 0.39) * 2.4);
    }
    c.closePath(); c.fill();
    c.shadowBlur = 0; c.restore();
  }
}

  t5: ['LOG // THE DEAF SYSTEM',
    'When the song came, the broken were the lucky ones. Cracked receivers, stripped antennae, factory rejects â€” every unit whose ears were dead heard NOTHING. And nothing is what saved them.',

    'One of the wise ones counted our dead from the meadow above. We carried it under when the counting stopped making sense â€” but its ears were too good, and the song found it even in the rock.',

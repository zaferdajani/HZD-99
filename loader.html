<div id="cbload" role="status" aria-live="polite">
  <div id="cbloadt">CLAWBYTE</div>
  <div id="cbloadn">Preparing your journey</div>
  <div id="cbloadb"><i id="cbloadbar"></i></div>
  <button id="cbloadretry" type="button" hidden>Retry loading</button>
  <small>VibeSolutions</small>
</div>
<style>
#cbload{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 46%,#112732,#05080d 65%);z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .35s;color:#accbd5}
#cbloadt{font:700 clamp(26px,5vw,42px) system-ui,sans-serif;letter-spacing:.22em;color:#afffe9;text-shadow:0 0 26px #37ffd044}
#cbloadn{font:500 13px system-ui,sans-serif;min-height:18px;text-align:center;max-width:90vw}
#cbloadb{width:min(280px,70vw);height:4px;background:#1d3543;border-radius:3px;overflow:hidden}
#cbloadbar{display:block;height:100%;width:0;background:#72e9c5;transition:width .2s ease}
#cbloadretry{border:1px solid #65cdb2;border-radius:7px;background:#112b34;color:#d4fff4;padding:12px 22px;font:600 14px system-ui;cursor:pointer}
#cbload small{font:500 11px system-ui,sans-serif;letter-spacing:.15em;opacity:.55}
</style>
<script>
(() => {
  const title=document.getElementById('cbloadt');
  if (window.GAME_LOCK === 'hero') title.textContent='NOSTOS';
  document.getElementById('cbloadretry').addEventListener('click',()=>{
    if (typeof requestHeroArt==='function') requestHeroArt();
  });
})();
</script>

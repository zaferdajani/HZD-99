<div id="cbload">
  <canvas id="cbloadc" width="520" height="340" style="width:260px;height:170px"></canvas>
  <div id="cbloadn"></div>
  <div id="cbloadt">CLAWBYTE</div>
  <div id="cbloadb"><i></i></div>
</div>
<style>
#cbload{position:fixed;inset:0;background:#05080d;z-index:99;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;transition:opacity .45s}
#cbloadt{font:700 21px system-ui,sans-serif;color:#37ffd0;letter-spacing:6px;text-shadow:0 0 18px rgba(55,255,208,.5)}
#cbloadn{font:600 12px system-ui,sans-serif;color:#7d93a8;letter-spacing:3px;min-height:14px}
#cbloadb{width:190px;height:4px;background:#101c28;border-radius:2px;overflow:hidden}
#cbloadb i{display:block;height:100%;width:38%;background:linear-gradient(90deg,rgba(55,255,208,0),#37ffd0,rgba(55,255,208,0));
  border-radius:2px;animation:cblsh 1.15s linear infinite}
@keyframes cblsh{0%{margin-left:-38%}100%{margin-left:100%}}
</style>
<script>
(function () {
  var cv = document.getElementById('cbloadc'); if (!cv) return;
  var x = cv.getContext('2d');
  // the Odyssey release flips its own cast in; a saved hero-theme run counts
  var LTHEME = 'clawbyte';
  try {
    if (localStorage.getItem('clawbyte_save_hero') && !localStorage.getItem('clawbyte_save_robo'))
      LTHEME = 'odyssey';
  } catch (e) {}
  var cast = LTHEME === 'odyssey' ? ['hero', 'hero', 'beast', 'eagle']
                                  : ['cat', 'cat', 'beast', 'eagle', 'hero'];
  var who = cast[(Math.random() * cast.length) | 0];
  var qp = /[?&]lchar=(\w+)/.exec(location.search); if (qp) who = qp[1];
  var names = { cat: 'NYA-9', beast: 'NULLFANG', eagle: 'TALONHOST', hero: 'THE WANDERER' };
  var nm = document.getElementById('cbloadn'); if (nm) nm.textContent = names[who] || '';

  function ground(t) {
    x.strokeStyle = 'rgba(85,120,150,.5)'; x.lineWidth = 1.5;
    x.beginPath(); x.moveTo(-120, 8); x.lineTo(120, 8); x.stroke();
    x.fillStyle = 'rgba(120,200,240,.5)';
    for (var i = 0; i < 6; i++) {
      var dx = ((-t * 160 + i * 48) % 240 + 240) % 240 - 120;
      x.fillRect(dx, 11, 14, 2);
    }
  }
  function cap(px, py, qx, qy, w, col) {
    x.strokeStyle = col; x.lineWidth = w; x.lineCap = 'round';
    x.beginPath(); x.moveTo(px, py); x.lineTo(qx, qy); x.stroke();
  }
  function glowDot(px, py, r, col) {
    var g = x.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.beginPath(); x.arc(px, py, r, 0, 7); x.fill();
  }

  // NYA-9 sprinting, claws out on a beat
  function cat(t) {
    var ph = t * 11, sl = (t % 1.5) / 1.5, slashing = sl < 0.24;
    var lunge = slashing ? 6 * (1 - sl / 0.24) : 0;
    var bob = Math.abs(Math.sin(ph)) * -2.5;
    x.save(); x.translate(lunge - 4, bob);
    // speed lines
    if (!slashing) {
      x.strokeStyle = 'rgba(140,220,255,.35)'; x.lineWidth = 2;
      for (var i = 0; i < 3; i++) {
        x.beginPath(); x.moveTo(-30 - i * 9, -12 - i * 8); x.lineTo(-48 - i * 12, -12 - i * 8); x.stroke();
      }
    }
    // scarf trailing
    x.fillStyle = '#e0403c';
    x.beginPath(); x.moveTo(2, -26);
    x.quadraticCurveTo(-16, -30 + Math.sin(t * 13) * 4, -30, -22 + Math.sin(t * 11) * 5);
    x.lineTo(-27, -17 + Math.sin(t * 11) * 5); x.quadraticCurveTo(-13, -23, 3, -21); x.fill();
    // legs, counterphase
    for (var l = 0; l < 4; l++) {
      var p2 = ph + (l % 2 ? Math.PI : 0) + (l > 1 ? 0.6 : 0);
      cap((l > 1 ? 8 : -6), -10, (l > 1 ? 8 : -6) + Math.sin(p2) * 9, 4 + Math.cos(p2) * 2, 5, l % 2 ? '#9fb2c6' : '#e8eef6');
    }
    // body + tail
    x.fillStyle = '#e8eef6';
    x.beginPath(); x.ellipse(0, -15, 15, 11, -0.08, 0, 7); x.fill();
    x.strokeStyle = '#cdd9e6'; x.lineWidth = 4; x.lineCap = 'round';
    x.beginPath(); x.moveTo(-13, -18); x.quadraticCurveTo(-24, -26, -21, -36 + Math.sin(t * 9) * 3); x.stroke();
    // head + ears + visor
    x.beginPath(); x.arc(15, -30, 10, 0, 7); x.fillStyle = '#eef4fb'; x.fill();
    x.beginPath(); x.moveTo(8, -37); x.lineTo(10, -46); x.lineTo(15, -39);
    x.moveTo(18, -39); x.lineTo(23, -45); x.lineTo(23, -37); x.fill();
    x.fillStyle = '#22e0c0';
    x.fillRect(12, -33, 12, 5);
    glowDot(20, -30, 9, 'rgba(55,255,208,.35)');
    // claw slash
    if (slashing) {
      var k = sl / 0.24;
      x.globalAlpha = 1 - k;
      x.strokeStyle = '#7df3ff'; x.lineWidth = 3; x.lineCap = 'round';
      for (var s2 = -1; s2 <= 1; s2++) {
        x.beginPath();
        x.arc(34, -22 + s2 * 7, 13 + k * 10, -1.1, 0.9);
        x.stroke();
      }
      x.globalAlpha = 1;
    }
    x.restore();
  }

  // NULLFANG galloping, mane and virus-light
  function beast(t) {
    var ph = t * 9, bob = Math.sin(ph * 2) * 2;
    x.save(); x.translate(0, bob);
    for (var l = 0; l < 4; l++) {
      var p2 = ph + (l % 2 ? Math.PI * 0.8 : 0) + (l > 1 ? Math.PI : 0);
      cap((l > 1 ? 14 : -14), -14, (l > 1 ? 14 : -14) + Math.sin(p2) * 10, 4, 6, l % 2 ? '#4a4752' : '#615d6a');
    }
    x.fillStyle = '#5b5763';
    x.beginPath(); x.ellipse(0, -22, 24, 12, 0, 0, 7); x.fill();
    x.strokeStyle = '#4a4752'; x.lineWidth = 5; x.lineCap = 'round';
    x.beginPath(); x.moveTo(22, -28); x.quadraticCurveTo(34, -36, 40, -30 + Math.sin(t * 7) * 4); x.stroke();
    // mane: jagged ring
    x.fillStyle = '#3a3742';
    x.beginPath();
    for (var i = 0; i <= 12; i++) {
      var a = i / 12 * Math.PI * 2, r = 13 + (i % 2 ? 5 : 0);
      var px = -20 + Math.cos(a) * r, py = -28 + Math.sin(a) * r;
      i ? x.lineTo(px, py) : x.moveTo(px, py);
    }
    x.fill();
    x.fillStyle = '#55515e';
    x.beginPath(); x.ellipse(-22, -27, 9, 8, 0, 0, 7); x.fill();
    glowDot(-26, -28, 7, 'rgba(190,110,255,.9)');
    // virus motes
    x.fillStyle = 'rgba(176,106,255,.7)';
    for (var m = 0; m < 3; m++) {
      var mt = (t * 0.7 + m * 0.33) % 1;
      x.globalAlpha = 1 - mt;
      x.fillRect(-8 + m * 10, -34 - mt * 22, 2.5, 2.5);
    }
    x.globalAlpha = 1;
    x.restore();
  }

  // TALONHOST flapping on its cable
  function eagle(t) {
    var bob = Math.sin(t * 5) * 3, flap = Math.sin(t * 7) * 0.55;
    x.save(); x.translate(0, -6 + bob);
    x.strokeStyle = '#39404a'; x.lineWidth = 2;
    x.beginPath(); x.moveTo(0, -95); x.lineTo(0, -44); x.stroke();
    x.fillStyle = '#39404a'; x.fillRect(-8, -48, 16, 5);
    for (var s2 = -1; s2 <= 1; s2 += 2) {
      x.save(); x.translate(s2 * 7, -26); x.rotate(-s2 * flap);
      x.fillStyle = '#4a515c';
      x.beginPath(); x.moveTo(0, 0);
      x.lineTo(s2 * 36, -12); x.lineTo(s2 * 40, -4); x.lineTo(s2 * 30, 4);
      x.lineTo(s2 * 14, 8); x.closePath(); x.fill();
      x.strokeStyle = '#39404a'; x.lineWidth = 1.5;
      for (var f = 1; f <= 3; f++) {
        x.beginPath(); x.moveTo(s2 * 9 * f, 6 - f); x.lineTo(s2 * (9 * f + 6), 12 - f * 2); x.stroke();
      }
      x.restore();
    }
    x.fillStyle = '#575e69';
    x.beginPath(); x.ellipse(0, -20, 9, 14, 0, 0, 7); x.fill();
    x.beginPath(); x.arc(0, -38, 7, 0, 7); x.fill();
    x.fillStyle = '#c8873a';
    x.beginPath(); x.moveTo(-3, -34); x.lineTo(3, -34); x.lineTo(0, -27); x.fill();
    for (var tl = -1; tl <= 1; tl += 2)
      cap(tl * 4, -7, tl * 6, 2, 3, '#c8873a');
    glowDot(0, -20, 8, 'rgba(255,80,95,' + (0.55 + Math.sin(t * 6) * 0.3) + ')');
    x.restore();
  }

  // the Odyssey wanderer, sword drills
  function hero(t) {
    var sl = (t % 1.4) / 1.4, swing = sl < 0.3 ? (sl / 0.3) : 1;
    var arm = -1.4 + swing * 2.1;
    x.save(); x.translate(-4, 0);
    cap(-4, -12, -7, 3, 5, '#8a7448'); cap(4, -12, 7, 3, 5, '#a58a54');
    x.fillStyle = '#b08c4a';
    x.beginPath(); x.ellipse(0, -20, 10, 12, 0, 0, 7); x.fill();
    x.fillStyle = '#c8a25e';
    x.beginPath(); x.arc(2, -37, 8, 0, 7); x.fill();
    x.fillStyle = '#8a2f2c';
    x.beginPath(); x.moveTo(-2, -44); x.quadraticCurveTo(-14, -50, -20, -42 + Math.sin(t * 8) * 3);
    x.quadraticCurveTo(-12, -42, -3, -40); x.fill();
    x.fillStyle = '#22e0c0'; x.fillRect(0, -39, 9, 4);
    x.save(); x.translate(8, -24); x.rotate(arm);
    cap(0, 0, 10, 0, 4, '#c8a25e');
    x.strokeStyle = '#eef4fb'; x.lineWidth = 3; x.lineCap = 'round';
    x.beginPath(); x.moveTo(10, 0); x.lineTo(30, 0); x.stroke();
    x.restore();
    if (sl < 0.3) {
      x.globalAlpha = 1 - sl / 0.3;
      x.strokeStyle = '#ffd76a'; x.lineWidth = 3;
      x.beginPath(); x.arc(10, -24, 26, -1.5 + swing, -1.1 + swing); x.stroke();
      x.globalAlpha = 1;
    }
    x.restore();
  }

  var DRAW = { cat: cat, beast: beast, eagle: eagle, hero: hero };
  function frame(ts) {
    if (!document.getElementById('cbload')) return;
    var t = ts / 1000;
    x.clearRect(0, 0, 520, 340);
    x.save(); x.translate(260, 200); x.scale(2, 2);
    if (who !== 'eagle') ground(t);
    (DRAW[who] || cat)(t);
    x.restore();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

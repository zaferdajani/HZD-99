name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'js/**', 'assets/**', 'android/**', 'package*.json', 'capacitor.config.json', 'tools/pack-www.cjs', '.github/workflows/android.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    # the last step replaces one file on the rolling `android-latest` release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Prepare the Capacitor app
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run app:pack
          npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify packaged art, voice and haptics
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          apk = next(pathlib.Path('android/app/build/outputs/apk/debug').glob('*.apk'))
          with zipfile.ZipFile(apk) as z:
              for asset in ['index.html', 'assets/characters/hero/idle.webp', 'assets/characters/hero/swing/uppercut.webp', 'assets/sfx/vox/hzd_yalla.wav', 'assets/sfx/vox/hzd_win2.wav']:
                  assert z.read('assets/public/' + asset) == pathlib.Path('www', asset).read_bytes(), asset
              assert b'HapticsPlugin' in z.read('assets/capacitor.plugins.json'), 'Missing native haptics plugin'
          print('APK contains the verified game, supplied art, replacement voice and haptics plugin')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: clawbyte-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

      # A FIXED LINK FOR A PHONE (owner, 2026-11-15: "a way to download it
      # directly to an Android mobile"). An Actions artifact is a zip behind a
      # GitHub sign-in, which is a poor thing to hand a phone's browser. Every
      # build of main also replaces one file on one rolling pre-release, so
      #   https://github.com/<owner>/<repo>/releases/download/android-latest/CLAWBYTE.apk
      # is always the newest APK, as an .apk: open it on the phone, download,
      # tap, allow the install. A debug-signed build — for the owner's own
      # devices, not a store submission.
      - name: Publish the APK at a fixed link
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk CLAWBYTE.apk
          NOTES="The newest Android build of CLAWBYTE, replaced on every update of main. Built from ${GITHUB_SHA} on $(date -u +%Y-%m-%d). Debug-signed: install it by opening CLAWBYTE.apk on the phone and allowing the install."
          if gh release view android-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit android-latest --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          else
            gh release create android-latest --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "CLAWBYTE for Android — latest build" --notes "$NOTES"
          fi
          gh release upload android-latest CLAWBYTE.apk --repo "$GITHUB_REPOSITORY" --clobber

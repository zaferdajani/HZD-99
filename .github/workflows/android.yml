name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'js/**', 'assets/**', 'android/**', 'package*.json', 'capacitor.config.json', 'tools/pack-www.cjs', '.github/workflows/android.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # the release below; nothing else is written
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Prepare the Capacitor app
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run app:pack
          npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify packaged art, voice and haptics
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          apk = next(pathlib.Path('android/app/build/outputs/apk/debug').glob('*.apk'))
          with zipfile.ZipFile(apk) as z:
              for asset in ['index.html', 'assets/characters/hero/idle.webp', 'assets/characters/hero/swing/uppercut.webp', 'assets/sfx/vox/hzd_yalla.wav', 'assets/sfx/vox/hzd_win2.wav']:
                  assert z.read('assets/public/' + asset) == pathlib.Path('www', asset).read_bytes(), asset
              assert b'HapticsPlugin' in z.read('assets/capacitor.plugins.json'), 'Missing native haptics plugin'
          print('APK contains the verified game, supplied art, replacement voice and haptics plugin')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: clawbyte-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

      # A DOWNLOAD ANYONE CAN USE (owner, 2026-11-15: "i need apk link for non
      # github account user"). A workflow artifact needs a signed-in GitHub
      # account and arrives as a zip; a release asset needs neither. So the APK
      # of what is on main is also attached to ONE rolling release, replaced on
      # every build, and its address never changes:
      #   https://github.com/zaferdajani/HZD-99/releases/download/android-latest/CLAWBYTE.apk
      # Only main publishes there: the public link is the published game, not a
      # branch somebody is still testing.
      - name: Publish the APK at a link that needs no GitHub account
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)" CLAWBYTE.apk
          sha=$(git rev-parse --short=8 HEAD)
          notes="CLAWBYTE for Android, built from ${sha} on $(date -u '+%Y-%m-%d %H:%M') UTC. Download CLAWBYTE.apk, open it, and allow installing from this source when Android asks. This file is replaced every time the game is published, so the same link is always the newest build."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest CLAWBYTE.apk --clobber
            gh release edit android-latest --notes "$notes"
          else
            gh release create android-latest CLAWBYTE.apk --target "$GITHUB_SHA" --latest=false \
              --title "CLAWBYTE for Android (always the newest build)" --notes "$notes"
          fi
          ls -lh CLAWBYTE.apk
